<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>주문서 (Lite)</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" crossorigin="anonymous"></script>
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['NanumSquareNeo', 'Pretendard', 'sans-serif'] }, colors: { brand: { 50: '#f8fafc', 500: '#64748b', 600: '#475569', 700: '#334155' }, kakao: '#FEE500' } } } }
    </script>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo/nanumsquareneo.css");
        body { font-family: 'NanumSquareNeo', sans-serif; background-color: #f1f5f9; transition: background-color 0.3s, color 0.3s; overflow: hidden; }
        body.dark { background-color: #0f172a; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .custom-checkbox { appearance: none; background-color: #fff; margin: 0; width: 1.4em; height: 1.4em; border: 2px solid #cbd5e1; border-radius: 4px; display: grid; place-content: center; cursor: pointer; transition: all 0.2s; }
        .dark .custom-checkbox { background-color: #1e293b; border-color: #475569; }
        .custom-checkbox::before { content: ""; width: 0.8em; height: 0.8em; transform: scale(0); transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em white; background-color: white; transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .custom-checkbox:checked { background-color: #475569; border-color: #475569; }
        .custom-checkbox:checked::before { transform: scale(1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .resizable-panel { resize: horizontal; overflow: hidden; min-height: 100%; position: relative; }
        .resizable-panel::after { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; cursor: se-resize; }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback, memo } = React;

        const urlParams = new URLSearchParams(window.location.search);
        const WS_ID = urlParams.get('ws') || 'default';
        const getLsKey = (key) => `${WS_ID}_${key}`;

        const FIXED_BANK_ACCOUNT = "카카오뱅크 김선정\n7942 18 01611";
        
        const EMOJI_LIST = [
            "🛍️","🛒","🎁","📦","🏷️","💰","💸","💳","🧾","🪙",
            "👗","👕","👖","👚","👔","🧥","🩳","👙","🩱","👘","🥻",
            "👠","👟","👞","🥾","🥿","👡","👢","🩰",
            "👜","💼","🎒","🧳","👛","👝",
            "💄","💋","💅","🧴","🪞","🎀","✂️",
            "💎","💍","👑","⌚","👓","🕶️","🧣","🧤","🌂","🧦",
            "🧢","👒","🎩","🎓","⛑️",
            "🌸","🌺","🌻","🌼","🌷","🌹","🥀","🪷","💐","🪴","🍀","🌿",
            "💙","💖","💛","💚","💜","🤍","❤️","🖤","🤎","💕","💞","💗","💓","💘","💝",
            "😍","🥰","😘","🤩","😎","🤗","😊","☺️","😉","😆","😁","😄","😃","😀","😋","😝","😜","🤪","🥳","🥺",
            "⭐","🌟","✨","🔥","💥","💯","✅","✔️","❌","❗","❓","📢","🔔","🌈","💡","📌","📍","🎈","🎉","🎊",
            "🚗","🚚","✈️","🚀","🛵","📱","💻","⌨️","🖥️",
            "🐻","🐰","🐱","🐶","🐼","🐯","🦊","🦁","🐮","🐷","🐸","🐒","🐥","🐧","🦄","🐙","🦑","🦀","🐠","🐳","🦋",
            "🍎","🍊","🍋","🍌","🍉","🍇","🍓","🍈","🍒","🍑","🥭","🍍","🥥","🥝","🍅","🥑",
            "🍔","🍟","🍕","🌭","🥪","🌮","🌯","🥩","🍗","🍖","🍚","🍛","🍜","🍝","🍞","🥐","🥖","🥨","🥞","🧀",
            "🍦","🍧","🍨","🍩","🍪","🎂","🍰","🧁","🥧","🍫","🍬","🍭","🍮","🍯","🍼","☕","🍵","🥤","🧋","🧃",
            "🍺","🍻","🥂","🍷","🥃","🍸","🍹","🧉","🍾","🧊"
        ];

        const Icon = ({ name, className="", weight="regular", size }) => <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{fontSize: size}}></i>;
        
        const normalizeString = (str) => String(str || '').replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, '').toLowerCase();

        const getCleanSheetId = (idOrUrl) => {
            if (!idOrUrl) return '';
            const match = idOrUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : idOrUrl.trim();
        };

        const getChosung = (str) => {
            if (!str) return '';
            const safeStr = String(str);
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅇ","ㅆ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let result = "";
            for (let i = 0; i < safeStr.length; i++) {
                const code = safeStr.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) result += cho[Math.floor(code / 588)];
                else result += safeStr.charAt(i);
            }
            return result;
        };

        const cleanForMatch = (str) => {
            if (!str) return '';
            let s = String(str).toLowerCase().replace(/\s/g, '');
            s = s.replace(/[—–−_]/g, '-');
            if (s.includes('-')) s = s.split('-')[0];
            s = s.replace(/[\(\)\[\]\{\}\.\,\/]/g, '');
            if (/[가-힣]/.test(s)) s = s.replace(/[a-z0-9]+$/, '');
            return s;
        };

        const parseSafeDate = (val) => {
            if (!val) return new Date(0);
            const s = String(val).trim();
            let d = new Date(s);
            if (!isNaN(d) && d.getTime() > 0) return d;
            const match = s.match(/(\d{4})[./-]\s*(\d{1,2})[./-]\s*(\d{1,2})/);
            if (match) return new Date(parseInt(match[1]), parseInt(match[2])-1, parseInt(match[3]));
            return new Date(0);
        };

        const fetchGas = async (url, payload = null) => {
            const options = { method: payload ? 'POST' : 'GET', redirect: "follow" };
            if (payload) {
                options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                options.body = JSON.stringify(payload);
            }
            try {
                const response = await fetch(url, options);
                const text = await response.text();
                
                if (text.includes("<!DOCTYPE") || text.includes("<html")) {
                    console.warn("GAS URL 오류");
                    return { status: "error", message: "앱스 스크립트 주소/권한 오류" };
                }
                
                try { return JSON.parse(text); } 
                catch(e) { return { status: "error", message: "데이터 변환 실패" }; }
            } catch (err) {
                return { status: "error", message: `통신 오류 (${err.message})` };
            }
        };

        const useLocalStorage = (key, initialValue) => {
            const actualKey = getLsKey(key);
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(actualKey);
                    if (!item) return initialValue;
                    return JSON.parse(item);
                } catch (error) { return initialValue; }
            });

            useEffect(() => {
                const timer = setTimeout(() => {
                    const saveData = () => { try { window.localStorage.setItem(actualKey, JSON.stringify(storedValue)); } catch(e) {} };
                    if (window.requestIdleCallback) window.requestIdleCallback(saveData, { timeout: 1000 });
                    else saveData();
                }, 800);
                return () => clearTimeout(timer);
            }, [actualKey, storedValue]);

            const setValue = useCallback((value) => {
                try { setStoredValue(prev => value instanceof Function ? value(prev) : value); } catch (error) {}
            }, []);

            return [storedValue, setValue];
        };

        const downloadExcel = (data, fileName) => {
            const ws = XLSX.utils.json_to_sheet(data);
            const range = XLSX.utils.decode_range(ws['!ref']);
            for(let R = range.s.r; R <= range.e.r; ++R) {
                for(let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_address = {c:C, r:R}; const cell_ref = XLSX.utils.encode_cell(cell_address);
                    if(!ws[cell_ref]) continue; if(!ws[cell_ref].s) ws[cell_ref].s = {};
                    ws[cell_ref].s.alignment = { wrapText: true, vertical: 'top' };
                }
            }
            ws['!cols'] = [{wch: 15}, {wch: 40}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 60}];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `${fileName}_${new Date().toLocaleDateString()}.xlsx`);
        };

        const playSound = async (type, isEnabled) => {
            if (!isEnabled || !window.Tone) return;
            try {
                if (Tone.context.state !== 'running') await Tone.start();
                if (type === 'deposit') {
                    const synth = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 } }).toDestination();
                    synth.volume.value = -10;
                    synth.triggerAttackRelease("E6", "16n");
                }
            } catch (e) { console.error("Sound error", e); }
        };

        const Modal = ({ isOpen, type, message, onConfirm, onCancel, initialValue }) => {
            const [inputValue, setInputValue] = useState(initialValue || '');
            const inputRef = useRef(null);
            
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!isOpen) return;
                    if (type !== 'confirm' && type !== 'alert') { 
                        if (e.key === 'Enter') onConfirm(inputValue); 
                    } else { 
                        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onConfirm(); } 
                    }
                    if (e.key === 'Escape' && type !== 'alert') onCancel();
                };
                window.addEventListener('keydown', handleKeyDown); 
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isOpen, type, inputValue, onConfirm, onCancel]);
            
            useEffect(() => { 
                if (isOpen && type === 'prompt' && inputRef.current) { 
                    setInputValue(initialValue || ''); setTimeout(() => inputRef.current.focus(), 100); 
                } 
            }, [isOpen, type, initialValue]);
            
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop" onClick={type === 'alert' ? () => onConfirm() : undefined}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-80 max-w-sm" onClick={e => e.stopPropagation()}>
                        <div className="mb-4">
                            <h3 className="text-lg font-bold text-center text-slate-800 dark:text-slate-100 mb-2">{type === 'confirm' ? '확인' : type === 'prompt' ? '입력' : '알림'}</h3>
                            <p className="text-sm text-slate-600 dark:text-slate-400 text-center whitespace-pre-wrap leading-relaxed">{message}</p>
                        </div>
                        {type === 'prompt' && (
                            <input ref={inputRef} type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} className="w-full border dark:border-slate-600 rounded-lg px-3 py-2 mb-5 text-sm focus:ring-2 focus:ring-slate-500 outline-none bg-slate-50 dark:bg-slate-900 dark:text-slate-100"/>
                        )}
                        <div className="flex gap-2">
                            {type !== 'alert' && <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">취소</button>}
                            <button onClick={() => type === 'prompt' ? onConfirm(inputValue) : onConfirm()} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-slate-700 hover:bg-slate-800 transition-colors shadow-sm">확인</button>
                        </div>
                    </div>
                </div>
            );
        };

        const QuickAddressModal = ({ isOpen, nick, initialData, onClose, onSubmit, openModal }) => {
            const [formData, setFormData] = useState({ realname: '', phone: '', zipcode: '', address: '', detailAddress: '', memo: '' });
            const detailRef = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    if (initialData) { setFormData({ realname: initialData.realname || '', phone: initialData.phone || '', zipcode: initialData.zipcode || '', address: initialData.address || '', detailAddress: '', memo: initialData.memo || '' }); } 
                    else { setFormData({ realname: '', phone: '', zipcode: '', address: '', detailAddress: '', memo: '' }); }
                }
            }, [isOpen, initialData]);

            const handleSearch = () => {
                try {
                    new window.daum.Postcode({
                        oncomplete: function(data) {
                            let fullAddr = data.address; let extraAddr = '';
                            if(data.addressType === 'R'){
                                if(data.bname !== '') extraAddr += data.bname;
                                if(data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                                if(extraAddr !== '') fullAddr += ' (' + extraAddr + ')';
                            }
                            setFormData(prev => ({ ...prev, zipcode: data.zonecode, address: fullAddr }));
                            setTimeout(() => detailRef.current?.focus(), 100);
                        }
                    }).open();
                } catch (e) { if (openModal) openModal("주소 검색 오류가 발생했습니다.", "alert"); }
            };

            const handleSubmit = (e) => {
                e.preventDefault(); 
                const notify = (msg) => openModal ? openModal(msg, "alert") : alert(msg);
                if (!formData.realname.trim()) return notify("수령인 이름을 입력해주세요.");
                const cleanPhone = formData.phone.replace(/[^0-9]/g, '');
                if (!cleanPhone) return notify("유효한 연락처(숫자)를 입력해주세요.");
                if (!formData.address.trim()) return notify("배송 주소를 검색해서 입력해주세요.");
                const zipStr = formData.zipcode ? `(${formData.zipcode}) ` : '';
                const finalAddress = `${zipStr}${formData.address} ${formData.detailAddress}`.trim();
                onSubmit({ ...formData, zipcode: '', address: finalAddress, phone: cleanPhone, nickname: initialData ? initialData.nickname : nick });
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
                        <div className="mb-4 border-b dark:border-slate-700 pb-3 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2"><Icon name="pencil-line" weight="fill" /> '{initialData ? initialData.nickname : nick}' 배송지 {initialData ? '수정' : '빠른 입력'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icon name="x" weight="bold" size={20}/></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">수령인 이름 (필수)</label><input type="text" value={formData.realname} onChange={e=>setFormData({...formData, realname: e.target.value})} className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" placeholder="이름 입력" autoFocus /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">연락처 (숫자만)</label><input type="text" value={formData.phone} onChange={e=>setFormData({...formData, phone: e.target.value.replace(/[^0-9]/g, '')})} className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" placeholder="연락처" /></div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 mb-1">배송 주소 (필수)</label>
                                <div className="flex gap-2 mb-2"><input type="text" value={formData.zipcode} readOnly placeholder="우편번호" className="w-24 border dark:border-slate-600 rounded px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 cursor-not-allowed" /><button type="button" onClick={handleSearch} className="bg-slate-600 text-white px-3 py-2 rounded text-sm font-bold shadow-sm">주소 검색</button></div>
                                <input type="text" value={formData.address} readOnly placeholder="검색 버튼을 눌러 기본 주소를 찾아주세요" className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 mb-2 cursor-not-allowed" />
                                <input ref={detailRef} type="text" value={formData.detailAddress} onChange={e=>setFormData({...formData, detailAddress: e.target.value})} placeholder="상세 주소 (동, 호수 등)" className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" />
                            </div>
                            <div><label className="block text-[10px] font-bold text-slate-500 mb-1">배송 메모 (선택)</label><input type="text" value={formData.memo} onChange={e=>setFormData({...formData, memo: e.target.value})} className="w-full border dark:border-slate-600 rounded px-3 py-2 text-sm bg-transparent dark:text-slate-100" placeholder="배송 요청사항" /></div>
                            <div className="pt-3 flex gap-2">
                                <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded font-bold text-sm bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">취소</button>
                                <button type="submit" className="flex-1 py-2.5 rounded font-bold text-sm bg-slate-700 text-white">저장 및 즉시 적용</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const SettingsField = ({ label, value, onChange, placeholder, type="text" }) => (
            <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">{label}</label>
                <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 dark:text-white focus:ring-1 focus:ring-slate-400 outline-none" />
            </div>
        );

        const VipModal = ({ isOpen, onClose, specialCustomers, setSpecialCustomers }) => {
            const [newVip, setNewVip] = useState('');
            if (!isOpen) return null;
            
            const handleAdd = (e) => {
                e.preventDefault();
                if(!newVip.trim()) return;
                const norm = normalizeString(newVip);
                setSpecialCustomers(prev => ({...prev, [norm]: { type: 'vip', originalName: newVip.trim() }}));
                setNewVip('');
            };
            const handleRemove = (key) => {
                setSpecialCustomers(prev => { const next = {...prev}; delete next[key]; return next; });
            };
            
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-sm mx-4" onClick={e => e.stopPropagation()}>
                        <div className="mb-4 border-b dark:border-slate-700 pb-3 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2"><Icon name="crown" weight="fill" className="text-amber-500" /> VIP 관리대장</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icon name="x" weight="bold" size={20}/></button>
                        </div>
                        <form onSubmit={handleAdd} className="flex gap-2 mb-4">
                            <input type="text" value={newVip} onChange={e=>setNewVip(e.target.value)} placeholder="VIP 닉네임 입력" className="flex-1 border dark:border-slate-600 rounded px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 dark:text-slate-100 outline-none" autoFocus />
                            <button type="submit" className="bg-slate-700 text-white px-3 py-2 rounded text-sm font-bold whitespace-nowrap shadow-sm hover:bg-slate-800">추가</button>
                        </form>
                        <div className="max-h-60 overflow-y-auto space-y-1">
                            {Object.entries(specialCustomers || {}).map(([key, val]) => (
                                <div key={key} className="flex justify-between items-center bg-slate-50 dark:bg-slate-700/50 p-2 rounded border dark:border-slate-600">

                        </div>
                        
                        <div className="border-t dark:border-slate-700 pt-4">

                            <div className="flex gap-2 mb-2">
                                <SettingsField label="기본 배송비" type="number" value={quickShipping} onChange={(v) => setQuickShipping(Number(v))} />
                                <SettingsField label="제주 추가" type="number" value={jejuShipping} onChange={(v) => setJejuShipping(Number(v))} />
                                <SettingsField label="무료 기준" type="number" value={freeShippingThreshold} onChange={(v) => setFreeShippingThreshold(v)} placeholder="예: 70000" />
                            </div>
                        </div>
                        
                        <div className="border-t dark:border-slate-700 pt-4">
                            <h4 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2 flex items-center gap-1"><Icon name="chat-text" weight="fill"/> 주문서 멘트 설정</h4>
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 mb-1">닉네임 이모지</label>
                                    <input type="text" value={templateConfig.emoji} onChange={(e)=>setTemplateConfig(p => ({...p, emoji: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-sm bg-slate-50 dark:bg-slate-900 dark:text-white mb-2 outline-none" />
                                    <div className="flex flex-wrap gap-1 bg-slate-50 dark:bg-slate-900 p-2 rounded border dark:border-slate-700 max-h-32 overflow-y-auto">
                                        {EMOJI_LIST.map(em => (<button type="button" key={em} onClick={() => setTemplateConfig(p => ({...p, emoji: em}))} className="w-7 h-7 flex items-center justify-center hover:bg-white dark:hover:bg-slate-700 rounded transition-all text-base">{em}</button>))}
                                    </div>
                                </div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">완납 메시지</label><input type="text" value={templateConfig.paidMsg} onChange={(e)=>setTemplateConfig(p => ({...p, paidMsg: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-sm bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">미납 안내</label><textarea value={templateConfig.unpaidPrefix} onChange={(e)=>setTemplateConfig(p => ({...p, unpaidPrefix: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-16 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">과납 안내</label><textarea value={templateConfig.overpaidMsg} onChange={(e)=>setTemplateConfig(p => ({...p, overpaidMsg: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-12 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">계좌번호</label><textarea value={bankAccount} onChange={(e)=>setBankAccount(e.target.value)} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-12 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">주소 있음 안내</label><textarea value={templateConfig.addrNotice} onChange={(e)=>setTemplateConfig(p => ({...p, addrNotice: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-12 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div><label className="block text-[10px] font-bold text-slate-500 mb-1">주소 없음 안내</label><textarea value={templateConfig.surveyNotice} onChange={(e)=>setTemplateConfig(p => ({...p, surveyNotice: e.target.value}))} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs h-24 resize-none bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" /></div>
                                <div className="flex items-center justify-between bg-slate-100 dark:bg-slate-800 p-2 rounded border dark:border-slate-600">
                                    <label className="text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer" onClick={() => setTemplateConfig(p => ({...p, alwaysRequestAddress: !p.alwaysRequestAddress}))}>주소록 무시하고 항상 새로 입력받기</label>
                                    <input type="checkbox" checked={templateConfig.alwaysRequestAddress || false} onChange={(e)=>setTemplateConfig(p => ({...p, alwaysRequestAddress: e.target.checked}))} className="custom-checkbox" />
                                </div>
                            </div>
                        </div>
                        <div className="border-t dark:border-slate-700 pt-4">
                            <h4 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2 flex items-center gap-1"><Icon name="lightning" weight="fill" className="text-slate-500"/> 빠른 댓글 설정</h4>
                            <div className="space-y-2">
                                {quickMessages.map((msg, idx) => (
                                    <input key={idx} type="text" value={msg} onChange={(e) => { const v = e.target.value; setQuickMessages(prev => { const next = [...prev]; next[idx] = v; return next; }); }} className="w-full border dark:border-slate-600 rounded px-2 py-1.5 text-xs bg-slate-50 dark:bg-slate-900 dark:text-white outline-none" />
                                ))}
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const InventoryItemRow = memo(({ item, orders, setOrders, inventory, setInventory, setProductHistory, openModal, expandedInventoryItem, setExpandedInventoryItem, setManualProduct, setCurrentSearchTerm, setManualPrice, setIsFixedProductMode, customerPaidStatus, saveInventoryToServer, cardPayments }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [localName, setLocalName] = useState(item.name);
            const [localPrice, setLocalPrice] = useState(item.price === 0 || item.price === '' ? '' : Number(item.price).toLocaleString());

            useEffect(() => { setLocalName(item.name); }, [item.name]);
            useEffect(() => { setLocalPrice(item.price === 0 || item.price === '' ? '' : Number(item.price).toLocaleString()); }, [item.price]);

            const activeOrders = useMemo(() => orders.filter(o => o.product === item.name && !o.isCancelled), [orders, item.name]);
            const orderedCount = activeOrders.reduce((sum, o) => sum + Number(o.quantity || 0), 0);
            
            const aggregatedOrders = useMemo(() => {
                const groups = {};
                activeOrders.forEach(o => {
                    if(!groups[o.customer]) { groups[o.customer] = { customer: o.customer, quantity: 0, orderIds: [] }; }
                    groups[o.customer].quantity += Number(o.quantity || 0);
                    groups[o.customer].orderIds.push(o.id);
                });
                return Object.values(groups).sort((a, b) => String(a.customer).localeCompare(String(b.customer), 'ko'));
            }, [activeOrders]);

            const isExpanded = expandedInventoryItem === item.name;

            const handleSave = () => {
                const newName = localName.trim();
                const newPrice = Number(String(localPrice).replace(/,/g, ''));
                if (!newName) { openModal('상품명을 입력해주세요.', 'alert'); return; }
                if (newName !== item.name && inventory.some(i => i.name === newName && i.id !== item.id)) { openModal('이미 동일한 이름의 상품이 있습니다.', 'alert'); setLocalName(item.name); return; }

                const newInv = inventory.map(i => i.id === item.id ? { ...i, name: newName, price: newPrice } : i);
                setInventory(newInv);
                saveInventoryToServer(newInv); 
                
                if (newName !== item.name || newPrice !== item.price) {
                    setOrders(prev => prev.map(o => { if (o.product === item.name) { return { ...o, product: newName, price: (Number(o.quantity) || 0) * newPrice }; } return o; }));
                    setProductHistory(prev => { const next = {...prev}; if (newName !== item.name) { next[newName] = newPrice; } else { next[item.name] = newPrice; } return next; });
                }
                setIsEditing(false);
            };

            const handleDelete = () => { 
                openModal(`'${item.name}' 항목을 재고 목록에서 삭제하시겠습니까?\n(기존 주문 내역은 유지됩니다)`, 'confirm', () => { 
                    const newInv = inventory.filter(i => i.id !== item.id);
                    setInventory(newInv);
                    saveInventoryToServer(newInv); 
                }); 
            };

            const handleToggleSoldOut = () => {
                const newInv = inventory.map(i => i.id === item.id ? { ...i, isSoldOut: !i.isSoldOut } : i);
                setInventory(newInv);
                saveInventoryToServer(newInv);
            };

            return (
                <div className="flex flex-col bg-white dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                    <div className={`flex items-center justify-between p-1.5 text-[11px] hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors ${item.isSoldOut ? 'bg-red-50/50 dark:bg-red-900/10' : ''}`}>
                        {isEditing ? (
                            <div className="flex-1 flex gap-1 items-center min-w-0 pr-1">
                                <input autoFocus type="text" value={localName} onChange={e=>setLocalName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleSave();}} className="w-full border dark:border-slate-600 bg-transparent dark:text-white px-1 py-0.5 rounded text-[10px] outline-none" placeholder="상품명" />
                                <input type="text" value={localPrice} onChange={e=>{const v = e.target.value.replace(/,/g, ''); if(!isNaN(v)) setLocalPrice(v ? Number(v).toLocaleString() : '');}} onKeyDown={e=>{if(e.key==='Enter')handleSave();}} className="w-14 border dark:border-slate-600 bg-transparent dark:text-white px-1 py-0.5 rounded text-[10px] text-right outline-none" placeholder="단가" />
                                <button onClick={handleSave} className="bg-slate-600 hover:bg-slate-700 text-white px-1.5 py-0.5 rounded shadow-sm"><Icon name="check" weight="bold"/></button>
                                <button onClick={()=>setIsEditing(false)} className="bg-slate-400 hover:bg-slate-500 text-white px-1.5 py-0.5 rounded shadow-sm"><Icon name="x" weight="bold"/></button>
                                <button onClick={handleDelete} className="bg-red-500 hover:bg-red-600 text-white px-1.5 py-0.5 rounded shadow-sm ml-1"><Icon name="trash" weight="bold"/></button>
                            </div>
                        ) : (
                            <>
                                <div className={`flex-1 font-bold truncate pr-1 cursor-pointer select-none ${item.isSoldOut ? 'text-red-500 dark:text-red-400' : 'text-slate-800 dark:text-slate-200'}`} title="클릭: 복사 / 더블클릭: 자동 고정 입력"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        const textArea = document.createElement("textarea"); textArea.value = item.name; document.body.appendChild(textArea); textArea.select();
                                        try { document.execCommand('copy'); } catch (err) {} document.body.removeChild(textArea);
                                        const el = e.currentTarget; el.classList.add('text-green-600', 'dark:text-green-400'); setTimeout(() => el.classList.remove('text-green-600', 'dark:text-green-400'), 300);
                                    }}
                                    onDoubleClick={(e) => {
                                        e.stopPropagation(); setManualProduct(item.name); setCurrentSearchTerm(item.name); setManualPrice(item.price ? Number(item.price).toLocaleString() : '');
                                        setIsFixedProductMode(true); document.getElementById('manual-prod-input')?.focus();
                                    }}
                                >
                                    {item.name}
                                </div>
                                <button onClick={(e) => { e.stopPropagation(); handleToggleSoldOut(); }} className={`px-1.5 py-0.5 rounded text-[9px] font-bold shrink-0 mx-1 shadow-sm transition-colors ${item.isSoldOut ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-slate-200 text-slate-600 hover:bg-slate-300 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600'}`}>{item.isSoldOut ? '판매' : '품절'}</button>
                                <button onClick={(e) => { e.stopPropagation(); setIsEditing(true); }} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 w-5 flex justify-center shrink-0"><Icon name="pencil-simple" weight="bold"/></button>
                                <div className={`w-12 text-center text-[11px] font-bold shrink-0 ${item.isSoldOut ? 'text-red-400' : 'text-slate-800 dark:text-slate-300'}`}>{item.price ? Number(item.price).toLocaleString() : '0'}</div>
                                <div className={`w-10 text-center font-bold shrink-0 ${item.isSoldOut ? 'text-red-400' : 'text-slate-600 dark:text-slate-400'}`}>{orderedCount}</div>
                                <button onClick={(e) => { e.stopPropagation(); setExpandedInventoryItem(isExpanded ? null : item.name); }} className={`ml-1 p-0.5 rounded text-slate-400 hover:text-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors shrink-0 w-5 flex justify-center ${isExpanded ? 'bg-slate-200 dark:bg-slate-600 text-slate-700' : ''}`}><Icon name="caret-down" weight="bold" className={`transition-transform ${isExpanded ? 'rotate-180' : ''}`} /></button>
                            </>
                        )}
                    </div>
                    {isExpanded && !isEditing && (
                        <div className="bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 p-1.5 flex flex-col gap-1">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-[10px] font-bold text-slate-600 dark:text-slate-400 flex items-center gap-1"><Icon name="users" weight="fill" /> 주문 고객 ({aggregatedOrders.length}명)</span>
                                <button onClick={(e) => {
                                    e.stopPropagation();
                                    if(aggregatedOrders.length === 0) return;
                                    let text = `[${item.name} ${Number(item.price).toLocaleString()}원 / ${aggregatedOrders.length}명]\n`;
                                    const nameList = aggregatedOrders.map(agg => agg.quantity > 1 ? `${agg.customer}(${agg.quantity})` : agg.customer);
                                    // 🚀 구분자를 한 글자짜리 깔끔한 ✦ 로 연결
                                    text += nameList.join(' ✦ ');
                                    const textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea); textArea.select();
                                    try { 
                                        document.execCommand('copy'); 
                                        const btn = e.currentTarget;
                                        const origClass = btn.className;
                                        const origText = btn.innerText;
                                        // 모달 대신 버튼 색상 1초 변경 피드백
                                        btn.className = "text-[9px] bg-green-500 text-white border border-green-600 px-1.5 py-0.5 rounded font-bold shadow-sm transition-colors";
                                        btn.innerText = "복사 완료!";
                                        setTimeout(() => {
                                            btn.className = origClass;
                                            btn.innerText = origText;
                                        }, 1000);
                                    } catch (err) {} 
                                    document.body.removeChild(textArea);
                                }} className="text-[9px] bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-600 hover:bg-slate-300 px-1.5 py-0.5 rounded font-bold shadow-sm transition-colors">명단 복사</button>
                            </div>
                            {aggregatedOrders.length === 0 ? (
                                <div className="text-center text-[10px] text-slate-400 py-2">주문 내역이 없습니다.</div>
                            ) : (
                                <div className="grid grid-cols-2 gap-1 max-h-[160px] overflow-y-auto pr-1">
                                    {aggregatedOrders.map(agg => {
                                        const isPaid = customerPaidStatus && customerPaidStatus[agg.customer];
                                        const isCard = cardPayments && cardPayments[agg.customer];
                                        
                                        let textColor = "text-slate-700 dark:text-slate-300";
                                        if (isCard) {
                                            textColor = "text-purple-600 font-bold dark:text-purple-400";
                                        } else if (!isPaid) {
                                            textColor = "text-red-500 font-bold dark:text-red-400";
                                        }
                                        
                                        return (
                                            <div key={agg.customer} className="flex justify-between items-center bg-white dark:bg-slate-800 p-1 rounded border border-slate-200 dark:border-slate-700 shadow-sm text-[10px] group hover:border-slate-300 min-w-0">
                                                <span className={`cursor-pointer hover:underline truncate flex-1 flex items-center gap-0.5 ${textColor}`} onClick={(e) => {
                                                    e.stopPropagation();
                                                    const textArea = document.createElement("textarea"); textArea.value = agg.customer; document.body.appendChild(textArea); textArea.select();
                                                    try { 
                                                        document.execCommand('copy'); 
                                                        const el = e.currentTarget;
                                                        // 모달 대신 글자 색상 0.5초 변경 피드백
                                                        el.style.color = '#22c55e';
                                                        setTimeout(() => el.style.color = '', 500);
                                                    } catch (err) {} 
                                                    document.body.removeChild(textArea);
                                                }} title="클릭하여 닉네임 복사">
                                                    <span className="truncate">{agg.customer}</span> {agg.quantity > 1 && <span className="text-slate-500 ml-0.5 shrink-0">({agg.quantity}개)</span>}
                                                    {isCard && <span className="text-[8px] bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-300 border border-purple-200 dark:border-purple-700 px-1 py-0.5 rounded shrink-0 leading-none">카드</span>}
                                                </span>
                                                <button onClick={(e) => {
                                                    e.stopPropagation();
                                                    openModal(`'${agg.customer}'님의 '${item.name}' 주문을 삭제하시겠습니까?`, 'confirm', () => { setOrders(prev => prev.filter(order => !agg.orderIds.includes(order.id))); });
                                                }} className="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 px-1.5 py-0.5 rounded font-bold shrink-0 ml-1 opacity-0 group-hover:opacity-100">삭제</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        });

        const OrderItem = memo(({ item, nick, nextItemId, isLast, handleProductChange, handleQuantityUpdate, handleOrderCancel, handleOrderDelete, addOrderLogic, setSelectedNick, inventory, productHistory }) => {
            const [localProduct, setLocalProduct] = useState(item.product); 
            const [localQty, setLocalQty] = useState(item.quantity === '' ? '' : item.quantity); 
            const [localPrice, setLocalPrice] = useState(item.price === '' || item.price === 0 ? '' : Number(item.price).toLocaleString());
            const [isProductFocused, setIsProductFocused] = useState(false); 
            const [isQtyFocused, setIsQtyFocused] = useState(false); 
            const [isPriceFocused, setIsPriceFocused] = useState(false);
            
            useEffect(() => { if (!isProductFocused) setLocalProduct(item.product); }, [item.product, isProductFocused]); 
            useEffect(() => { if (!isQtyFocused) setLocalQty(item.quantity === '' ? '' : item.quantity); }, [item.quantity, isQtyFocused]); 
            useEffect(() => { if (!isPriceFocused) setLocalPrice(item.price === '' || item.price === 0 ? '' : Number(item.price).toLocaleString()); }, [item.price, isPriceFocused]);
            
            return (
                <div className={`flex justify-between items-center text-xs px-1 py-0.5 rounded group transition-colors ${item.isCancelled ? 'bg-red-50/80 dark:bg-red-900/10 border border-red-100 dark:border-red-900/30' : (item.isUnmodified ? 'bg-blue-100 dark:bg-blue-900/50 border-2 border-blue-400 dark:border-blue-600 shadow-sm my-0.5' : 'hover:bg-slate-100 dark:hover:bg-slate-700 border-2 border-transparent')}`}>

                                        <div className="flex items-center gap-1 overflow-hidden min-w-0">

                                            {d.source === 'manual' && <span className="text-[8px] text-slate-400 dark:text-slate-500 bg-slate-200 dark:bg-slate-700 px-0.5 rounded shrink-0">수동</span>}
                                        </div>
                                        <div className="flex items-center gap-1.5 shrink-0 ml-1">
                                            {isUsed ? <span className="text-[8px] font-bold text-green-600 dark:text-green-400 whitespace-nowrap">완료</span> : <span className="text-[8px] text-slate-400 dark:text-slate-500 whitespace-nowrap">{formatTimeOnly(d.time || d.date)}</span>}
                                            <span className={`font-bold text-[12px] ${isUsed ? 'text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-300'}`}>+{Number(d.amount).toLocaleString()}</span>
                                        </div>
                                        <button onClick={(e)=>{e.stopPropagation(); handleDeleteDepositItem(d.id);}} className="absolute -right-1 -top-1 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity shadow-sm"><Icon name="trash" size={10} weight="bold"/></button>
                                    </div>

                        </div>
                        <div className="p-1 bg-white dark:bg-slate-800 text-center font-bold text-[10px] border-t dark:border-slate-700 shrink-0">총: <span className="text-slate-800 dark:text-slate-200 text-xs">{totalDepositAmount.toLocaleString()}</span>원</div>
                    </div>

                    {/* 재고 영역 (폭 24%) */}
                    <div className="flex flex-col bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-lg shadow-sm resizable-panel" style={{ width: '24%', minWidth: '200px' }}>
                        <div className="p-2 bg-slate-100 dark:bg-slate-800 border-b dark:border-slate-700 flex flex-col gap-2 shrink-0">
                            <div className="font-bold text-slate-800 dark:text-slate-200 flex items-center justify-between">
                                <span className="flex items-center gap-1"><Icon name="package" weight="fill"/> 실시간 재고</span>
                                <div className="flex items-center gap-1.5">
                                    <span className="text-xs text-slate-500 dark:text-slate-400">{inventory.length}종</span>
                                    <button onClick={(e) => { e.stopPropagation(); setIsBatchModalOpen(true); }} className="bg-slate-600 hover:bg-slate-700 text-white text-[9px] px-1.5 py-0.5 rounded shadow-sm transition-colors flex items-center gap-0.5" title="옵션 일괄 생성"><Icon name="list-plus" weight="bold"/> 일괄옵션</button>
                                </div>
                            </div>
                            <div className="flex items-center gap-1 mt-1">
                                <form onSubmit={handleQuickAddProduct} className="flex-1 flex gap-1 items-center bg-white dark:bg-slate-900 p-0.5 rounded border dark:border-slate-600">
                                    <input type="text" placeholder="새 상품명" value={newInvName} onChange={e=>setNewInvName(e.target.value)} className="w-full text-[10px] px-1.5 py-1 bg-transparent outline-none dark:text-white font-bold" />
                                    <input type="text" placeholder="단가" value={newInvPrice} onChange={e=> { const val = e.target.value.replace(/,/g, ''); if(!isNaN(val)) setNewInvPrice(val ? Number(val).toLocaleString() : ''); }} className="w-14 text-[10px] px-1 py-1 bg-transparent text-right outline-none dark:text-white font-bold" />
                                    <button type="submit" className="bg-slate-700 hover:bg-slate-800 text-white px-1.5 py-1 rounded text-[10px] font-bold shrink-0">등록</button>
                                </form>
                                <div className="relative w-16 sm:w-20 shrink-0">
                                    <Icon name="magnifying-glass" className="absolute left-1.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]"/>
                                    <input type="text" placeholder="검색" value={inventorySearchTerm} onChange={e => setInventorySearchTerm(e.target.value)} className="w-full text-[10px] pl-4 pr-1 py-1 border dark:border-slate-600 rounded outline-none bg-white dark:bg-slate-900 dark:text-white" />
                                </div>
                            </div>
                        </div>
                        <div className="flex w-full bg-slate-50 dark:bg-slate-800 p-1.5 border-b border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-500 dark:text-slate-400 items-center text-center shrink-0">
                            <div className="flex-1 text-left pl-1">상품명 <span className="text-[8px] font-normal">(수정가능)</span></div>
                            <div className="w-5 shrink-0"></div>
                            <div className="w-14 shrink-0 text-center">단가</div>
                            <div className="w-8 shrink-0 text-center">주문</div>
                            <div className="w-6 shrink-0"></div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-1.5 space-y-1.5 bg-slate-50 dark:bg-slate-900">
                            {inventory.filter(i => !inventorySearchTerm || String(i.name).toLowerCase().includes(String(inventorySearchTerm).toLowerCase())).map(item => (
                                <InventoryItemRow 
                                    key={item.id} item={item} orders={orders} setOrders={setOrders} inventory={inventory} setInventory={setInventory} setProductHistory={setProductHistory} openModal={openModal} expandedInventoryItem={expandedInventoryItem} setExpandedInventoryItem={setExpandedInventoryItem} setManualProduct={setManualProduct} setCurrentSearchTerm={setCurrentSearchTerm} setManualPrice={setManualPrice} setIsFixedProductMode={setIsFixedProductMode} customerPaidStatus={customerPaidStatus} saveInventoryToServer={saveInventoryToServer} cardPayments={cardPayments}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const OrderManagementTab = ({ orders, shippingOverrides, quickShipping, jejuShipping, freeShippingThreshold, broadcastName, addresses, handleExportBackup, handleImportBackup, cardPayments, specialCustomers, openModal, cashReceipts, inventory, productHistory }) => {
            const getMasterAddress = (nick) => {
                if (!nick) return null;
                const clean = normalizeString(nick);
                return addresses.find(a => normalizeString(a.nickname) === clean);
            };

            const getCalculatedShipping = (nick, productTotal) => {
                if (shippingOverrides && shippingOverrides[nick] !== undefined) return Number(shippingOverrides[nick]);
                const nickNorm = normalizeString(nick);
                const specialKey = Object.keys(specialCustomers || {}).find(k => normalizeString(k) === nickNorm);
                if (specialKey && specialCustomers[specialKey].type === 'vip') return 0;
                const addr = getMasterAddress(nick);
                const isJeju = addr && addr.address && addr.address.includes('제주');
                let calcShip = (freeShippingThreshold > 0 && productTotal >= freeShippingThreshold) ? 0 : Number(quickShipping);
                if (isJeju) { calcShip += (Number(jejuShipping) - Number(quickShipping)); }
                return Math.max(0, calcShip);
            };

            const handleExportProducts = () => { 
                const summary = {}; const unpaidSummary = {}; const paidSummary = {}; const customerPaidStatus = {}; const customerGroups = {};
                orders.forEach(o => { if(!customerGroups[o.customer]) customerGroups[o.customer] = []; customerGroups[o.customer].push(o); });
                const savedCardPayments = cardPayments || {};
                Object.entries(customerGroups).forEach(([nick, items]) => {
                    const activeItems = items.filter(i => !i.isCancelled); if(activeItems.length === 0) { customerPaidStatus[nick] = false; return; }
                    const isCard = savedCardPayments[nick]; 
                    const productTotal = activeItems.reduce((sum, i) => sum + Number(i.price), 0);
                    const shipping = getCalculatedShipping(nick, productTotal);
                    const depositTotal = items.reduce((sum, i) => sum + (i.deposit || 0), 0);
                    const grandTotal = productTotal + (activeItems.length > 0 ? shipping : 0); 
                    customerPaidStatus[nick] = (depositTotal >= grandTotal) || isCard;
                });
                orders.forEach(o => { 
                    if(o.isCancelled) return; 
                    const name = o.product || '(상품명 없음)'; 
                    if (!summary[name]) summary[name] = 0; if (!paidSummary[name]) paidSummary[name] = 0; if (!unpaidSummary[name]) unpaidSummary[name] = 0;
                    summary[name] += Number(o.quantity); if (customerPaidStatus[o.customer]) paidSummary[name] += Number(o.quantity); else unpaidSummary[name] += Number(o.quantity);
                }); 
                const sortedKeys = Object.keys(summary).filter(product => summary[product] > 0).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
                const data = sortedKeys.map(product => {
                    const invItem = inventory && Array.isArray(inventory) ? inventory.find(i => String(i.name).trim() === String(product).trim()) : null;
                    const price = invItem ? Number(invItem.price) : (productHistory && productHistory[product] ? Number(productHistory[product]) : 0);
                    return { 
                        '상품명': product, 
                        '제품금액': price,
                        '입금완료 수량': paidSummary[product]||0, 
                        '미입금 수량': (summary[product]||0) - (paidSummary[product]||0) 
                    };
                }); 
                downloadExcel(data, '상품별_발주리스트'); 
            };

            const handleExportCustomers = () => { 
                const groups = {}; orders.forEach(o => { if (!groups[o.customer]) groups[o.customer] = []; groups[o.customer].push(o); }); 
                let entries = Object.entries(groups).map(([nick, items]) => {
                    const activeItems = items.filter(i => !i.isCancelled); const isCard = cardPayments[nick]; 
                    const hasCashReceipt = cashReceipts[nick];
                    const productTotal = activeItems.reduce((sum, i) => sum + Number(i.price), 0);
                    const currentShipping = getCalculatedShipping(nick, productTotal);
                    const depositTotal = items.reduce((sum, i) => sum + (i.deposit || 0), 0); 
                    const grandTotal = productTotal + (activeItems.length > 0 ? currentShipping : 0); 
                    const isPaid = (depositTotal >= grandTotal) || isCard;
                    const balance = grandTotal - depositTotal;
                    return { nick, items: activeItems, isPaid, isCard, hasCashReceipt, depositTotal, grandTotal, balance };
                });

                const getStatusPriority = (entry) => { if (entry.isPaid && !entry.isCard) return 1; if (entry.isCard) return 2; return 3; };
                entries.sort((a, b) => { const pA = getStatusPriority(a); const pB = getStatusPriority(b); if (pA !== pB) return pA - pB; return a.nick.localeCompare(b.nick); });

                let excelRows = []; entries.forEach(({ nick, items, isPaid, isCard, hasCashReceipt, depositTotal, grandTotal, balance }) => { 
                    if(items.length === 0) return; 
                    const addrInfo = getMasterAddress(nick) || {}; 
                    const fullAddress = addrInfo.zipcode ? `(${addrInfo.zipcode}) ${addrInfo.address || ''}` : (addrInfo.address || ''); 
                    
                    let cleanPhone = String(addrInfo.phone || '').replace(/[^0-9]/g, '');
                    if (cleanPhone.length === 10 && !cleanPhone.startsWith('0')) cleanPhone = '0' + cleanPhone;

                    const statusColumn = isCard ? "카드결제" : (hasCashReceipt ? "현금영수증" : (isPaid ? "완납" : (depositTotal > 0 ? `부분입금(미수 ${balance.toLocaleString()})` : `미입금(미수 ${balance.toLocaleString()})`)));
                    const createRow = (productValue) => ({ '날짜시간': new Date().toLocaleString(), '공란1': '', '입금상태': statusColumn, '닉네임': nick, '주문제품(수량)': productValue, '이름': addrInfo.realname || '', '핸드폰번호': cleanPhone, '주소': fullAddress, '배송메모': addrInfo.memo || '' }); 
                    excelRows.push(createRow(`[ ${nick} ]`)); items.forEach(item => { const qtyPart = item.quantity > 1 ? ` ★${item.quantity}개` : ''; excelRows.push(createRow(`${item.product}${qtyPart}`)); }); 
                }); 
                downloadExcel(excelRows, '고객별_정산_배송리스트'); 
            };

            const handleExportAllMessages = () => {
                const groups = {}; 
                orders.forEach(o => { if (!groups[o.customer]) groups[o.customer] = []; groups[o.customer].push(o); });
                
                const templateConfigStr = localStorage.getItem(getLsKey('templateConfig'));
                const templateConfigLocal = templateConfigStr ? JSON.parse(templateConfigStr) : { emoji: '💙', paidMsg: '😍 완납 확인! 감사합니다 😍', unpaidPrefix: '[미입금]\n총 입금하실 금액\n👉', overpaidMsg: '과납 금액이 있습니다.\n환불 또는 적립 여부를 알려주세요!', addrNotice: '※ 배송지 변경 시 채팅으로 변경할 주소를 남겨주세요!', surveyNotice: '방송마다 1회 하단의 주문서(배송지입력) 필수!!', alwaysRequestAddress: false };
                
                const overpaidMsg = templateConfigLocal.overpaidMsg || '과납 금액이 있습니다.\n환불 또는 적립 여부를 알려주세요!';
                const bankStr = localStorage.getItem(getLsKey('bankAccount')) || "카카오뱅크 김선정\n7942 18 01611";
                const sentAddressRequestsStr = localStorage.getItem(getLsKey('sentAddressRequests'));
                const sentAddressRequestsLocal = sentAddressRequestsStr ? new Set(JSON.parse(sentAddressRequestsStr)) : new Set();
                
                const data = []; 
                Object.entries(groups).forEach(([nick, items]) => {
                    const activeItems = items.filter(i => !i.isCancelled); 
                    if (activeItems.length === 0) return;
                    
                    const isCard = cardPayments && cardPayments[nick];
                    const productTotal = activeItems.reduce((sum, i) => sum + Number(i.price), 0);
                    const currentShipping = getCalculatedShipping(nick, productTotal);
                    const baseGrandTotal = productTotal + currentShipping;
                    const depositTotal = items.reduce((sum, i) => sum + (i.deposit || 0), 0); 
                    const baseBalance = baseGrandTotal - depositTotal;
                    
                    const cardFee = (isCard && baseBalance > 0) ? baseBalance * 0.1 : 0;
                    const grandTotal = baseGrandTotal + cardFee; 
                    const balance = baseBalance + cardFee;

                    const itemListTextForMsg = activeItems.map(i => `${i.product}${i.quantity > 1 ? ` ★${i.quantity}개` : ''} ${Number(i.price).toLocaleString()}원`).join('\n');
                    const itemListTextForExcel = activeItems.map(i => `${i.product}(${i.quantity}개)`).join(', '); 
                    
                    const addrInfo = getMasterAddress(nick) || {};
                    
                    let msg = `${templateConfigLocal.emoji} ${nick} 님 ${templateConfigLocal.emoji}\n\n[${broadcastName} 주문목록]\n${itemListTextForMsg}\n배송비 ${currentShipping.toLocaleString()}원\n\n총 주문금액 ${baseGrandTotal.toLocaleString()}원\n------------------\n`;
                    let statusStr = '';
                    
                    if (isCard) { 
                        statusStr = '카드결제';
                        const cardBase = Math.max(0, baseGrandTotal - depositTotal); // 잔금 (총액 - 입금액)
                        if (depositTotal > 0) {
                            msg += `[카드결제]\n총 주문금액 ${baseGrandTotal.toLocaleString()}원\n선입금 ${depositTotal.toLocaleString()}원\n수수료(10%) ${(cardBase * 0.1).toLocaleString()}원\n👉결제요청액 ${(cardBase * 1.1).toLocaleString()}원 예정\n\n핸드폰번호 남겨주세요🌸\n------------------\n\n`; 
                        } else {
                            msg += `[카드결제]\n금액 ${cardBase.toLocaleString()}원\n수수료(10%) ${(cardBase * 0.1).toLocaleString()}원\n👉결제요청액 ${(cardBase * 1.1).toLocaleString()}원 예정\n\n핸드폰번호 남겨주세요🌸\n------------------\n\n`; 
                        }
                    } else { 
                        const isPaid = (balance <= 0) && (grandTotal >= 0); 
                        if (depositTotal > 0 && balance <= 0) {
                            msg += `[입금확인]\n${depositTotal.toLocaleString()}원\n------------------\n\n`; 
                        } else if (depositTotal > 0 && balance > 0) {
                            msg += `[입금확인]\n${depositTotal.toLocaleString()}원 (일부 입금)\n------------------\n\n`; 
                        }
                        
                        if (balance > 0) {
                            statusStr = depositTotal > 0 ? `부분입금(미수 ${balance.toLocaleString()})` : `미입금(미수 ${balance.toLocaleString()})`;
                            if (depositTotal > 0) {
                                msg += `[부분 미수 안내]\n남은 미수금 👉 ${balance.toLocaleString()}원\n\n${bankStr}\n추가 입금 부탁드립니다 🙏\n------------------\n\n`; 
                            } else {
                                msg += `${templateConfigLocal.unpaidPrefix}\n${balance.toLocaleString()}원 \n\n${bankStr}\n입금 부탁드립니다 🙏\n------------------\n\n`; 
                            }
                        } else if (balance < 0) {
                            statusStr = '과납';
                            msg += `${templateConfigLocal.paidMsg}\n\n[과납 안내]\n과납액: ${Math.abs(balance).toLocaleString()}원\n${overpaidMsg}\n------------------\n`;
                        } else {
                            statusStr = '입금';
                            if (isPaid) msg += `${templateConfigLocal.paidMsg}\n------------------\n`; 
                        }
                    }

                    if (addrInfo && addrInfo.address && !templateConfigLocal.alwaysRequestAddress) {
                        let cleanPhone = String(addrInfo.phone || '').replace(/[^0-9]/g, '');
                        if (cleanPhone.length === 10 && !cleanPhone.startsWith('0')) cleanPhone = '0' + cleanPhone;
                        msg += `\n[배송지 확인]\n\n${addrInfo.realname || nick}\n${cleanPhone}\n${addrInfo.address} ${addrInfo.zipcode ? `(${addrInfo.zipcode})` : ''}\n${addrInfo.memo ? addrInfo.memo + '\n' : ''}\n------------------\n${templateConfigLocal.addrNotice}`;
                    } else if (!templateConfigLocal.alwaysRequestAddress) { 
                        msg += `\n${templateConfigLocal.surveyNotice}`; 
                    }
                    
                    data.push({ 
                        '닉네임': nick, 
                        '상품명': itemListTextForExcel, 
                        '가격': grandTotal.toLocaleString() + '원', 
                        '입금액': depositTotal.toLocaleString() + '원', 
                        '상태': statusStr,
                        '카톡전송메세지': msg 
                    });
                });
                
                if (data.length === 0) { openModal("주문 내역이 없습니다.", "alert"); return; }
                data.sort((a, b) => String(a['닉네임'] || '').localeCompare(String(b['닉네임'] || '')));
                downloadExcel(data, '전체고객_카톡메세지_리스트');
            };

            const handleExportCashReceipts = () => {
                const groups = {}; 
                orders.forEach(o => { if (!groups[o.customer]) groups[o.customer] = []; groups[o.customer].push(o); });
                
                const data = []; 
                Object.entries(groups).forEach(([nick, items]) => {
                    if (!cashReceipts || !cashReceipts[nick]) return;
                    
                    const activeItems = items.filter(i => !i.isCancelled); 
                    if (activeItems.length === 0) return;
                    
                    const depositTotal = items.reduce((sum, i) => sum + (i.deposit || 0), 0); 
                    const addrInfo = getMasterAddress(nick) || {};
                    let cleanPhone = String(addrInfo.phone || '').replace(/[^0-9]/g, '');
                    if (cleanPhone.length === 10 && !cleanPhone.startsWith('0')) cleanPhone = '0' + cleanPhone;
                    
                    data.push({ 
                        '방송명': broadcastName, 
                        '닉네임': nick, 
                        '금액': depositTotal, 
                        '전화번호': cleanPhone 
                    });
                });
                
                if (data.length === 0) { openModal("현금영수증 요청자로 체크(현영)된 고객이 없습니다.", "alert"); return; }
                data.sort((a, b) => String(a['닉네임'] || '').localeCompare(String(b['닉네임'] || '')));
                downloadExcel(data, '현금영수증_요청리스트');
            };

           const handlePrintPackingList = () => {
               const groups = {};
               orders.forEach(o => {
                   if (o.isCancelled) return;
                   if (!groups[o.customer]) groups[o.customer] = [];
                   groups[o.customer].push(o);
               });
               if (Object.keys(groups).length === 0) { openModal("인쇄할 주문 내역이 없습니다.", "alert"); return; }
               
               let printContent = `
                   <!DOCTYPE html>
                   <html lang="ko">
                   <head>
                       <meta charset="UTF-8">
                       <title>포장리스트_인쇄</title>
                       <style>
                           @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo/nanumsquareneo.css");
                           @page { size: 100mm 150mm; margin: 0 !important; }
                           * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                           html, body { margin: 0; padding: 0; width: 100mm; background: #fff; color: #000; font-family: 'NanumSquareNeo', sans-serif; }
                           .slip { width: 100mm; padding: 8mm 4mm 4mm 4mm; page-break-after: always; position: relative; }
                           .nick { font-size: 26px; font-weight: 900; text-align: center; margin-bottom: 12px; border: 2px solid #000; padding: 8px 5px; border-radius: 8px; box-shadow: 3px 3px 0 #000; background-color: #fff; }
                           table { width: 100%; border-collapse: collapse; margin-bottom: 10px; table-layout: fixed; }
                           thead { display: table-header-group; }
                           tr { page-break-inside: avoid; page-break-after: auto; }
                           th, td { border-bottom: 1px solid #000; padding: 6px 2px; text-align: left; vertical-align: middle; }

                <div className="flex flex-col h-screen overflow-hidden text-slate-800 dark:text-slate-200">
                    <header className="h-12 bg-slate-900 text-white flex items-center justify-between px-4 shrink-0 shadow-md z-50">
                        <div className="font-bold text-lg flex items-center gap-2 text-slate-100"><Icon name="lightning" weight="fill" className="text-slate-400"/> KANG EJ <span className="text-xs text-slate-500 font-normal">Lite</span></div>
                        <div className="flex items-center gap-2">
                            <div className="flex bg-slate-800 rounded p-1 gap-1">
                                {[{ id: 'live', label: '라이브관제', icon: 'monitor-play' }, { id: 'manage', label: '주문관리', icon: 'file-xls' }].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded text-sm font-bold flex items-center gap-1 transition-all ${activeTab === tab.id ? 'bg-slate-200 text-slate-900' : 'text-slate-400 hover:text-white'}`}><Icon name={tab.icon} weight="bold"/> {tab.label}</button>
                                ))}
                            </div>
                            <button onClick={async () => {
                                const nextState = !soundEnabled;
                                setSoundEnabled(nextState);
                                if (nextState && window.Tone) {
                                    await Tone.start();
                                    playSound('deposit', true); 
                                }
                            }} className={`p-2 hover:bg-slate-800 rounded border border-slate-700 ml-2 transition-colors ${soundEnabled ? 'text-green-400' : 'text-slate-400'}`} title="알림음 켜기/끄기">
                                <Icon name={soundEnabled ? 'bell-ringing' : 'bell-slash'} weight="fill" size={20}/>
                            </button>
                            <button onClick={()=>setIsDarkMode(!isDarkMode)} className="p-2 hover:bg-slate-800 rounded border border-slate-700 ml-1"><Icon name={isDarkMode ? 'sun' : 'moon'} weight="fill" size={20}/></button>
                            <button onClick={()=>setIsVipModalOpen(true)} className="p-2 hover:bg-slate-800 rounded border border-slate-700 text-amber-400 ml-1" title="VIP 관리"><Icon name="crown" weight="fill" size={20}/></button>
                            <button onClick={()=>setIsSettingsOpen(!isSettingsOpen)} className="p-2 hover:bg-slate-800 rounded border border-slate-700 ml-1"><Icon name="gear" weight="fill" size={20}/></button>
                        </div>
                    </header>
                    
                    {globalError && <div className="bg-red-500 text-white text-xs font-bold text-center py-2 px-4 shadow-md z-[60] flex items-center justify-center gap-2"><Icon name="warning" weight="bold" size={16} /><span>{globalError}</span></div>}
                    
                    <Modal isOpen={modalConfig.isOpen} type={modalConfig.type} message={modalConfig.message} onConfirm={modalConfig.onConfirm} onCancel={modalConfig.onCancel} initialValue={modalConfig.initialValue} />
                    
                    <VipModal isOpen={isVipModalOpen} onClose={() => setIsVipModalOpen(false)} specialCustomers={specialCustomers} setSpecialCustomers={setSpecialCustomers} />

                    {isSettingsOpen && (
                        <SettingsModalContent 
                            googleScriptUrl={googleScriptUrl} setGoogleScriptUrl={setGoogleScriptUrl}
                            chatSheetId={chatSheetId} setChatSheetId={setChatSheetId}
                            depSheetId={depSheetId} setDepSheetId={setDepSheetId}
                            masterSheetId={masterSheetId} setMasterSheetId={setMasterSheetId}
                            addressStartDate={addressStartDate} setAddressStartDate={setAddressStartDate}
                            broadcastName={broadcastName} setBroadcastName={setBroadcastName}
                            quickShipping={quickShipping} setQuickShipping={setQuickShipping}
                            jejuShipping={jejuShipping} setJejuShipping={setJejuShipping}
                            freeShippingThreshold={freeShippingThreshold} setFreeShippingThreshold={setFreeShippingThreshold}
                            templateConfig={templateConfig} setTemplateConfig={setTemplateConfig}
                            bankAccount={bankAccount} setBankAccount={setBankAccount}
                            quickMessages={quickMessages} setQuickMessages={setQuickMessages}
                            setIsSettingsOpen={setIsSettingsOpen}
                        />
                    )}
                    
                    <main className="flex-1 overflow-hidden bg-slate-200 dark:bg-slate-950 p-2 relative">
                        {activeTab === 'live' && <LiveTab {...{ orders, setOrders, productHistory, setProductHistory, quickShipping, jejuShipping, freeShippingThreshold, shippingOverrides, setShippingOverrides, bankAccount, googleScriptUrl, chatSheetId, depSheetId, masterSheetId, masterAddresses, setMasterAddresses, cardPayments, setCardPayments, matchedDeposits, setMatchedDeposits, depositorNames, setDepositorNames, clickedChats, setClickedChats, openModal, keywords, setKeywords, deletedDepositIds, setDeletedDepositIds, checkedOrders, setCheckedOrders, templateConfig, specialCustomers, setSpecialCustomers, inventory, setInventory, quickMessages, handleResetAllData, broadcastName, setGlobalError, cashReceipts, setCashReceipts, soundEnabled, addressStartDate }} />}
                        {activeTab === 'manage' && <OrderManagementTab {...{ orders, shippingOverrides, quickShipping, jejuShipping, freeShippingThreshold, broadcastName, addresses: masterAddresses, handleExportBackup, handleImportBackup, cardPayments, specialCustomers, openModal, cashReceipts, inventory, productHistory }} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>주문서 관리 시스템</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['NanumSquareNeo', 'Pretendard', 'sans-serif'] } } } }
    </script>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo/nanumsquareneo.css");
        html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; }
        body { font-family: 'NanumSquareNeo', sans-serif; background-color: #f1f5f9; transition: background-color 0.3s, color 0.3s; overflow: hidden; }
        #root { height: 100%; }
        
        /* 모바일/태블릿 브라우저 UI로 인한 하단 짤림 완벽 방지 */
        @supports (height: 100dvh) {
            .h-screen { height: 100dvh !important; }
        }
        @supports not (height: 100dvh) {
            .h-screen { height: 100% !important; }
        }

        body.dark { background-color: #0f172a; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .custom-checkbox { appearance: none; background-color: #fff; margin: 0; width: 1.4em; height: 1.4em; border: 2px solid #cbd5e1; border-radius: 4px; display: grid; place-content: center; cursor: pointer; transition: all 0.2s; }
        .dark .custom-checkbox { background-color: #1e293b; border-color: #475569; }
        .custom-checkbox::before { content: ""; width: 0.8em; height: 0.8em; transform: scale(0); transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em white; background-color: white; transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .custom-checkbox:checked { background-color: #475569; border-color: #475569; }
        .custom-checkbox:checked::before { transform: scale(1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .resizable-panel { resize: horizontal; overflow: hidden; min-height: 100%; position: relative; }
        .resizable-panel::after { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; cursor: se-resize; }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback, memo } = React;

        const urlParams = new URLSearchParams(window.location.search);
        const WS_ID = urlParams.get('ws') || 'default';
        const getLsKey = (key) => `${WS_ID}_${key}`;

        const FIXED_BANK_ACCOUNT = "카카오뱅크 김선정\n7942 18 01611";
        const EMOJI_LIST = [
            "👗","👚","👕","👖","👔","👙","👘","👠","👡","👢","👞","👟","🥾","🧦","🧤","🧣","🎩","🧢","👒","👑","💍","👝","👛","👜","💼","🎒","🧳","👓","🕶","🌂",
            "💄","💅","💋","🎀","🛍️","🎁","💝","💎","🧴","🪞","🧼","🧽",
            "🌸","🌺","🌻","🌼","🌷","🌹","🥀","💐",
            "🍎","🍓","🍒","🍑","🍋","🍌","🍉","🍇","🥑","🥝",
            "💙","💖","💛","💚","💜","🤍","❤️","🖤","🤎","💕","💞","💗","💓","💘",
            "😍","🥰","😘","🤩","😎","🤗","😊","☺️","😉","😆","😁","😄","😃","😀",
            "⭐","🌟","✨","🔥","💥","💯","✅","✔️","❌","❗","❓","📢","🔔","🌈","💡","📌","📍",
            "💰","💸","💳","🧾","🪙","🛒","🚗","🚚","✈️","🚀","🛵","📱","💻","🎉","🎈","🎊",
            "🐻","🐰","🐱","🐶","🐼","🐯","🦊","🦁","🐮","🐷","🐸","🐒","🐥","🐧","🦋"
        ];

        const Icon = ({ name, className="", weight="regular", size }) => <i className={`ph ph-${name} ${className}`} data-phosphor-icon-weight={weight} style={{fontSize: size}}></i>;
        
        const normalizeString = (str) => String(str || '').replace(/[\s\(\)\[\]\{\}\-\_\.\,\/]/g, '').toLowerCase();

        const getCleanSheetId = (idOrUrl) => {
            if (!idOrUrl) return '';
            const match = idOrUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : idOrUrl.trim();
        };

        const getChosung = (str) => {
            if (!str) return '';
            const safeStr = String(str);
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅇ","ㅆ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let result = "";
            for (let i = 0; i < safeStr.length; i++) {
                const code = safeStr.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) result += cho[Math.floor(code / 588)];
                else result += safeStr.charAt(i);
            }
            return result;
        };

        const cleanForMatch = (str) => {
            if (!str) return '';
            let s = String(str).toLowerCase().replace(/\s/g, '');
            s = s.replace(/[—–−_]/g, '-');
            if (s.includes('-')) s = s.split('-')[0];
            s = s.replace(/[\(\)\[\]\{\}\.\,\/]/g, '');
            if (/[가-힣]/.test(s)) s = s.replace(/[a-z0-9]+$/, '');
            return s;
        };

    const extractKo = (str) => {
            if (!str) return '';
            return String(str).replace(/[^가-힣]/g, '');
        };

        const fixPhoneNumber = (numStr) => {
            if (!numStr) return '';
            let cleaned = String(numStr).replace(/[^0-9]/g, '');
            if (cleaned.length === 10 && !cleaned.startsWith('0')) cleaned = '0' + cleaned;
            return cleaned;
        };

        const parseSafeDate = (val) => {
            if (!val) return new Date(0);
            const s = String(val).trim();
            const match = s.match(/(\d{4})[./-]\s*(\d{1,2})[./-]\s*(\d{1,2})/);
            if (match) return new Date(parseInt(match[1]), parseInt(match[2])-1, parseInt(match[3]));
            let d = new Date(s);
            if (!isNaN(d) && d.getTime() > 0) return d;
            return new Date(0);
        };

        const formatTimeOnly = (val) => { 
            if (!val) return ''; const strVal = String(val); const dt = new Date(strVal.replace(/-/g, '/'));
            if (!isNaN(dt) && strVal.length > 8) return dt.toLocaleTimeString('ko-KR', {hour12: false, hour:'2-digit', minute:'2-digit'});
            const timeMatch = strVal.match(/(\d{1,2}):(\d{2})/);
            if (timeMatch) {
                let hour = parseInt(timeMatch[1], 10);
                if ((strVal.includes('오후') || strVal.toUpperCase().includes('PM')) && hour < 12) hour += 12;
                else if ((strVal.includes('오전') || strVal.toUpperCase().includes('AM')) && hour === 12) hour = 0;
                return `${String(hour).padStart(2, '0')}:${timeMatch[2]}`;
            }
            return strVal; 
        };

        const fetchGas = async (url, payload = null) => {
            const options = { method: payload ? 'POST' : 'GET', redirect: "follow" };
            if (payload) {
                options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                options.body = JSON.stringify(payload);
            }
            try {
                const response = await fetch(url, options);
                const text = await response.text();
                
                if (text.includes("<!DOCTYPE") || text.includes("<html")) {
                    return { status: "error", message: "앱스 스크립트 주소/권한 오류" };
                }
                try { return JSON.parse(text); } catch(e) { return { status: "error", message: "데이터 변환 실패" }; }
            } catch (err) { return { status: "error", message: `통신 오류 (${err.message})` }; }
        };

        const useLocalStorage = (key, initialValue) => {
            const actualKey = getLsKey(key);
            const [storedValue, setStoredValue] = useState(() => {
                try { const item = window.localStorage.getItem(actualKey); return item ? JSON.parse(item) : initialValue; } catch (error) { return initialValue; }
            });
            useEffect(() => {
                const timer = setTimeout(() => { try { window.localStorage.setItem(actualKey, JSON.stringify(storedValue)); } catch(e) {} }, 800);
                return () => clearTimeout(timer);
            }, [actualKey, storedValue]);
            const setValue = useCallback((value) => { try { setStoredValue(prev => value instanceof Function ? value(prev) : value); } catch (error) {} }, []);
            return [storedValue, setValue];
        };

        const downloadExcel = (data, fileName) => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `${fileName}_${new Date().toLocaleDateString()}.xlsx`);
        };

        const Modal = ({ isOpen, type, message, onConfirm, onCancel, initialValue }) => {
            const [inputValue, setInputValue] = useState(initialValue || '');
            const inputRef = useRef(null);
        const inputValueRef = useRef(inputValue);
useEffect(() => { inputValueRef.current = inputValue; }, [inputValue]);

useEffect(() => {
    const handleKeyDown = (e) => {
        if (!isOpen) return;
        if (type !== 'confirm' && type !== 'alert') { 
            if (e.key === 'Enter') onConfirm(inputValueRef.current); 
        } else { 
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onConfirm(); } 
        }
        if (e.key === 'Escape' && type !== 'alert') onCancel();
    };
    window.addEventListener('keydown', handleKeyDown); 
    return () => window.removeEventListener('keydown', handleKeyDown);
}, [isOpen, type, onConfirm, onCancel]);    
          
            
            useEffect(() => { if (isOpen && type === 'prompt' && inputRef.current) { setInputValue(initialValue || ''); setTimeout(() => inputRef.current.focus(), 100); } }, [isOpen, type, initialValue]);
            
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop" onClick={type === 'alert' ? () => onConfirm() : undefined}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-80 max-w-sm" onClick={e => e.stopPropagation()}>
                        <div className="mb-4">
                            <h3 className="text-lg font-bold text-center text-slate-800 dark:text-slate-100 mb-2">{type === 'confirm' ? '확인' : type === 'prompt' ? '입력' : '알림'}</h3>
                            <p className="text-sm text-slate-600 dark:text-slate-400 text-center whitespace-pre-wrap leading-relaxed">{message}</p>
                        </div>
                        {type === 'prompt' && (
                            <input ref={inputRef} type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} className="w-full border dark:border-slate-600 rounded-lg px-3 py-2 mb-5 text-sm focus:ring-2 focus:ring-slate-500 outline-none bg-slate-50 dark:bg-slate-900 dark:text-slate-100"/>
                        )}
                        <div className="flex gap-2">
                            {type !== 'alert' && <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">취소</button>}
                            <button onClick={() => type === 'prompt' ? onConfirm(inputValue) : onConfirm()} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-slate-700 hover:bg-slate-800 transition-colors shadow-sm">확인</button>
                        </div>
                    </div>
                </div>
            );
        };

        const MultiAddModal = ({ isOpen, nick, inventory, onClose, addOrderLogic }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = React.useDeferredValue(searchTerm);
            const [selectedItems, setSelectedItems] = useState({});

            useEffect(() => {
                if (isOpen) {
                    setSearchTerm('');
                    setSelectedItems({});
                }
            }, [isOpen]);

            const handleKeyDown = useCallback((e) => {
                if (isOpen && e.key === 'Escape') onClose();
            }, [isOpen, onClose]);
useEffect(() => {
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleKeyDown]);

            // ✨ useMemo를 먼저 실행하고!
            const filteredInventory = useMemo(() => {
                const lowerSearchTerm = deferredSearchTerm.toLowerCase();
                return (inventory || []).filter(i => 
                    String(i.name).toLowerCase().includes(lowerSearchTerm)
                );
            }, [inventory, deferredSearchTerm]);

            // ✨ 그 다음에 화면을 가리도록 (if문) 순서를 바꿨습니다.
            if (!isOpen) return null;

            const totalQty = Object.values(selectedItems).reduce((sum, qty) => sum + qty, 0);
            
            const handleAdd = () => {
                if (totalQty === 0) return;
                Object.entries(selectedItems).forEach(([name, qty]) => {
                    if (qty > 0) {
                        addOrderLogic(nick, name, qty, false, null, null, false, false);
                    }
                });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-4 w-full max-w-md mx-4 flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                        <div className="mb-3 border-b dark:border-slate-700 pb-2 flex justify-between items-center shrink-0">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                                <Icon name="shopping-cart" weight="fill" className="text-blue-500" /> '{nick}' 장바구니
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icon name="x" weight="bold" size={20}/></button>
                        </div>
                        
                        <div className="relative mb-3 shrink-0">
                            <Icon name="magnifying-glass" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 size={14}"/>
                            <input 
                                type="text" 
                                placeholder="상품명 검색..." 
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                autoFocus
                                className="w-full border dark:border-slate-600 rounded-lg pl-8 pr-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 pb-2">
                            {filteredInventory.length === 0 ? (
                                <div className="text-center py-6 text-slate-400 text-sm">검색 결과가 없습니다.</div>
                            ) : (
                                filteredInventory.map(item => {
                                    const isSelected = selectedItems[item.name] > 0;
                                    const qty = selectedItems[item.name] || 0;
                                    return (
                                        <div key={item.id || item.name} className={`flex items-center justify-between p-2 rounded-lg border transition-all ${isSelected ? 'bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-700 ring-1 ring-blue-200' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-blue-300'} ${item.isSoldOut ? 'opacity-60' : ''}`}>
                                            <div className="flex-1 min-w-0 pr-2">
                                                <div className={`font-bold text-sm truncate ${item.isSoldOut ? 'text-red-500 line-through' : (isSelected ? 'text-blue-700 dark:text-blue-300' : 'text-slate-800 dark:text-slate-200')}`}>
                                                    {item.name} {item.isSoldOut && '(품절)'}
                                                </div>
                                                <div className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                                    단가: {Number(item.price).toLocaleString()}원 | 남은재고: {item.stock !== undefined && item.stock !== '' ? item.stock : '∞'}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2 shrink-0">
                                                <button 
                                                    onClick={() => setSelectedItems(prev => ({...prev, [item.name]: Math.max(0, (prev[item.name]||0)-1)}))}
                                                    className="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 flex items-center justify-center font-bold transition-colors"
                                                ><Icon name="minus" weight="bold"/></button>
                                                <span className="w-4 text-center font-bold text-sm dark:text-white">{qty}</span>
                                                <button 
                                                    onClick={() => setSelectedItems(prev => ({...prev, [item.name]: (prev[item.name]||0)+1}))}
                                                    className="w-7 h-7 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 hover:bg-blue-200 flex items-center justify-center font-bold transition-colors"
                                                ><Icon name="plus" weight="bold"/></button>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>

                        <div className="mt-2 pt-3 border-t dark:border-slate-700 shrink-0">
                            <button 
                                onClick={handleAdd}
                                disabled={totalQty === 0}
                                className={`w-full py-3 rounded-lg font-bold text-sm transition-colors flex justify-center items-center gap-2 shadow-sm ${totalQty > 0 ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 cursor-not-allowed'}`}
                            >
                                {totalQty > 0 ? `총 ${totalQty}개 일괄 추가하기` : '상품을 선택해주세요'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const QuickAddressModal = ({ isOpen, nick, initialData, onClose, onSubmit, openModal }) => {
            const [formData, setFormData] = useState({ realname: '', phone: '', zipcode: '', address: '', detailAddress: '', memo: '' });
            const detailRef = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    if (initialData) { setFormData({ realname: initialData.realname || '', phone: initialData.phone || '', zipcode: initialData.zipcode || '', address: initialData.address || '', detailAddress: '', memo: initialData.memo || '' }); } 
                    else { setFormData({ realname: '', phone: '', zipcode: '', address: '', detailAddress: '', memo: '' }); }
                }
            }, [isOpen, initialData]);

            const handleSearch = () => {
                try {
                    new window.daum.Postcode({
                        oncomplete: function(data) {
                            let fullAddr = data.address; let extraAddr = '';
                            if(data.addressType === 'R'){
                                if(data.bname !== '') extraAddr += data.bname;
                                if(data.buildingName !== '') extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                                if(extraAddr !== '') fullAddr += ' (' + extraAddr + ')';
                            }
                            setFormData(prev => ({ ...prev, zipcode: data.zonecode, address: fullAddr }));
                            setTimeout(() => detailRef.current?.focus(), 100);
                        }
                    }).open();
                } catch (e) { if (openModal) openModal("주소 검색 오류가 발생했습니다.", "alert"); }
            };

            const handleSubmit = (e) => {
                e.preventDefault(); 
                const notify = (msg) => openModal ? openModal(msg, "alert") : alert(msg);
                if (!formData.realname.trim()) return notify("수령인 이름을 입력해주세요.");
                const cleanPhone = formData.phone.replace(/[^0-9]/g, '');
                if (!cleanPhone) return notify("유효한 연락처(숫자)를 입력해주세요.");
                if (!formData.address.trim()) return notify("배송 주소를 검색해서 입력해주세요.");
                const zipStr = formData.zipcode ? `(${formData.zipcode}) ` : '';
                const finalAddress = `${zipStr}${formData.address} ${formData.detailAddress}`.trim();
                onSubmit({ ...formData, zipcode: '', address: finalAddress, phone: cleanPhone, nickname: initialData ? initialData.nickname : nick });
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[9999] animate-pop" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
                        <div className="mb-4 border-b dark:border-slate-700 pb-3 flex justify-between items-center">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2"><Icon name="pencil-line" weight="fill" /> '{initialData ? initialData.nickname : nick}' 배송지 {initialData ? '수정' : '빠른 입력'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><Icon name="x" weight="bold" size={20}/></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div className="grid grid-cols-2 gap-3">

        const InventoryItemRow = memo(({ item, itemStats, setOrders, setInventory, setProductHistory, openModal, expandedInventoryItem, setExpandedInventoryItem, setManualProduct, setCurrentSearchTerm, setManualPrice, setIsFixedProductMode, customerPaidStatus, saveInventoryToServer, cardPayments }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [localName, setLocalName] = useState(item.name);
            const [localPrice, setLocalPrice] = useState(item.price === 0 || item.price === '' ? '' : Number(item.price).toLocaleString());
            const [localStock, setLocalStock] = useState(item.stock === undefined || item.stock === '' ? '' : item.stock);

            useEffect(() => { setLocalName(item.name); }, [item.name]);
            useEffect(() => { setLocalPrice(item.price === 0 || item.price === '' ? '' : Number(item.price).toLocaleString()); }, [item.price]);
            useEffect(() => { setLocalStock(item.stock === undefined || item.stock === '' ? '' : item.stock); }, [item.stock]);

            const orderedCount = itemStats ? itemStats.count : 0;
            const aggregatedOrders = itemStats ? itemStats.aggregated : [];

            const isExpanded = expandedInventoryItem === item.name;

            const handleSave = () => {
                const newName = localName.trim();
                const newPrice = Number(String(localPrice).replace(/,/g, ''));
                const newStock = localStock === '' ? '' : parseInt(localStock);
                if (!newName) { openModal('상품명을 입력해주세요.', 'alert'); return; }

                let isDuplicate = false;
                setInventory(prevInv => {
                    if (newName !== item.name && prevInv.some(i => i.name === newName && i.name !== item.name)) { 
                        isDuplicate = true;
                        return prevInv; 
                    }
                    const newInv = prevInv.map(i => i.name === item.name ? { ...i, name: newName, price: newPrice, stock: newStock } : i);
                    saveInventoryToServer(newInv); 
                    return newInv;
                });

                if (isDuplicate) {
                    openModal('이미 동일한 이름의 상품이 있습니다.', 'alert'); 
                    setLocalName(item.name);
                    return;
                }
                
                if (newName !== item.name || newPrice !== item.price) {
                    setOrders(prev => prev.map(o => { if (o.product === item.name) { return { ...o, product: newName, price: (Number(o.quantity) || 0) * newPrice }; } return o; }));
                    setProductHistory(prev => { const next = {...prev}; if (newName !== item.name) { next[newName] = newPrice; } else { next[item.name] = newPrice; } return next; });
                }
                setIsEditing(false);
            };

            const handleDelete = () => { 
                openModal(`'${item.name}' 항목을 재고 목록에서 삭제하시겠습니까?\n(기존 주문 내역은 유지됩니다)`, 'confirm', () => { 
                    setInventory(prevInv => {
                        const newInv = prevInv.filter(i => i.name !== item.name);
                        saveInventoryToServer(newInv);
                        return newInv;
                    });
                }); 
            };

            const handleToggleSoldOut = () => {
                setInventory(prevInv => {
                    const newInv = prevInv.map(i => i.name === item.name ? { ...i, isSoldOut: !i.isSoldOut } : i);
                    saveInventoryToServer(newInv);
                    return newInv;
                });
            };

            const handleCopyNames = (e) => {
                e.stopPropagation();
                if(aggregatedOrders.length === 0) return;
                let text = `[${item.name} ${Number(item.price).toLocaleString()}원 / ${aggregatedOrders.length}명]\n`;
                const nameList = aggregatedOrders.map(agg => agg.quantity > 1 ? `${agg.customer}(${agg.quantity})` : agg.customer);
                text += nameList.join(' ✦ ');
                
                const textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea); textArea.select();
                try { document.execCommand('copy'); } catch (err) {} document.body.removeChild(textArea);
                
                const el = e.currentTarget;
                const originalText = el.innerHTML;
                const originalBg = el.className;
                el.innerHTML = '복사 완료!';
                el.className = 'text-[9px] bg-green-500 text-white px-1.5 py-0.5 rounded font-bold shadow-sm transition-colors';
                setTimeout(() => {
                    el.innerHTML = originalText;
                    el.className = originalBg;
                }, 1000);
            };

            return (

                    const targetRealClean = targetReal ? cleanForMatch(targetReal) : '';
                    const targetRealKo = targetReal ? extractKo(targetReal) : '';

                    const checkMatch = (tClean, tKo, vClean, vKo) => {
                        if (!tClean && !tKo) return 10;
                        if (tClean && vClean && tClean === vClean) return 0;
                        if (tKo && vKo && tKo === vKo && tKo.length >= 2) return 0;
                        if (tClean && vClean && (tClean.includes(vClean) || vClean.includes(tClean)) && Math.min(tClean.length, vClean.length) >= 2) return 1;
                        if (tKo && vKo && (tKo.includes(vKo) || vKo.includes(tKo)) && Math.min(tKo.length, vKo.length) >= 2) return 1;

                        const aNickKo = extractKo(a.nickname);

                        const scoreNick = Math.min(
                            checkMatch(targetNickClean, targetNickKo, aNickClean, aNickKo),

                        );
                        const scoreReal = Math.min(

                        );

                    <div className="flex flex-col bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-lg shadow-sm resizable-panel" style={{ width: '20%', minWidth: '200px' }}>

                                    <input type="text" placeholder="단가" value={newInvPrice} onChange={e=> { const val = e.target.value.replace(/,/g, ''); if (val === '' || val === '-') setNewInvPrice(val); else if(!isNaN(val)) setNewInvPrice(Number(val).toLocaleString()); }} className="w-12 text-[10px] px-1 py-1 bg-transparent text-right outline-none dark:text-white font-bold" />
                                    <input type="number" placeholder="재고(무한)" value={newInvStock} onChange={e=>setNewInvStock(e.target.value)} className="w-12 text-[10px] px-1 py-1 bg-transparent text-right outline-none dark:text-white font-bold" />

                            </div>
                        </div>
                        <div className="flex w-full bg-slate-50 dark:bg-slate-800 p-1.5 border-b border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-500 dark:text-slate-400 items-center text-center shrink-0">
                            <div className="flex-1 text-left pl-1">상품명</div>

                        <div className="flex-1 overflow-y-auto p-1.5 space-y-1.5 bg-slate-50 dark:bg-slate-900">
                            {inventory
                                .filter(i => !deferredSearchTerm || String(i.name).toLowerCase().includes(String(deferredSearchTerm).toLowerCase()))
                                .sort((a, b) => String(b.name).localeCompare(String(a.name), 'ko', { numeric: true }))
                                .map(item => (
                                    <InventoryItemRow key={item.id || item.name} item={item} itemStats={inventoryStats[item.name]} setOrders={setOrders} setInventory={setInventory} setProductHistory={setProductHistory} openModal={openModal} expandedInventoryItem={expandedInventoryItem} setExpandedInventoryItem={setExpandedInventoryItem} setManualProduct={setManualProduct} setCurrentSearchTerm={setCurrentSearchTerm} setManualPrice={setManualPrice} setIsFixedProductMode={setIsFixedProductMode} customerPaidStatus={customerPaidStatus} saveInventoryToServer={saveInventoryToServer} cardPayments={cardPayments} />
                            ))}

                    </div>
                </div>
            );
        };

        const OrderManagementTab = ({ orders, shippingOverrides, quickShipping, jejuShipping, freeShippingThreshold, broadcastName, addresses, handleExportBackup, handleImportBackup, addressMapping, cardPayments, specialCustomers, openModal, cashReceipts, inventory, productHistory, noShowCustomers, waitlistCustomers }) => {
            const findAddress = (nick) => {
                if (!nick) return undefined;
                const cleanNick = normalizeString(nick);
                const mappedTarget = addressMapping[nick] || addressMapping[cleanNick];
                if (mappedTarget === '__UNMAPPED__') return undefined;
                
                let matches = addresses.filter(a => normalizeString(a.nickname) === (mappedTarget ? normalizeString(mappedTarget) : cleanNick));
                if (matches.length === 0 && !mappedTarget) {
                    matches = addresses.filter(a => normalizeString(a.realname) === cleanNick);
                }

                if (matches.length > 0) {
                    matches.sort((a,b) => parseSafeDate(b.timestamp).getTime() - parseSafeDate(a.timestamp).getTime());
                    const masterMatch = matches.find(m => m._source === 'master');
                    return masterMatch || matches[0];
                }
                return undefined;
            };

            const getCalculatedShipping = (nick, productTotal) => {
                if (shippingOverrides && shippingOverrides[nick] !== undefined) return Number(shippingOverrides[nick]);
                const nickNorm = normalizeString(nick); const specialKey = Object.keys(specialCustomers || {}).find(k => normalizeString(k) === nickNorm);
                if (specialKey && specialCustomers[specialKey].type === 'vip') return 0;
                const addr = findAddress(nick); const isJeju = addr && addr.address && addr.address.includes('제주');
                let calcShip = (freeShippingThreshold > 0 && productTotal >= freeShippingThreshold) ? 0 : Number(quickShipping);
                if (isJeju) { calcShip += (Number(jejuShipping) - Number(quickShipping)); }
                return Math.max(0, calcShip);
            };

            const handleExportProducts = () => { 
                const summary = {}; const unpaidSummary = {}; const paidSummary = {}; const customerPaidStatus = {}; const customerGroups = {};
                orders.forEach(o => { if(!customerGroups[o.customer]) customerGroups[o.customer] = []; customerGroups[o.customer].push(o); });
                const savedCardPayments = cardPayments || {};
                Object.entries(customerGroups).forEach(([nick, items]) => {
                    const activeItems = items.filter(i => !i.isCancelled); if(activeItems.length === 0) { customerPaidStatus[nick] = false; return; }
                    const isCard = savedCardPayments[nick]; const productTotal = activeItems.reduce((sum, i) => sum + Number(i.price), 0);
                    const shipping = getCalculatedShipping(nick, productTotal); const depositTotal = items.reduce((sum, i) => sum + (i.deposit || 0), 0);
                    const grandTotal = productTotal + (activeItems.length > 0 ? shipping : 0); customerPaidStatus[nick] = (depositTotal >= grandTotal) || isCard;
                });
                orders.forEach(o => { 
                    if(o.isCancelled) return; const name = o.product || '(상품명 없음)'; 
                    if (!summary[name]) summary[name] = 0; if (!paidSummary[name]) paidSummary[name] = 0; if (!unpaidSummary[name]) unpaidSummary[name] = 0;
                    summary[name] += Number(o.quantity); if (customerPaidStatus[o.customer]) paidSummary[name] += Number(o.quantity); else unpaidSummary[name] += Number(o.quantity);
                }); 
                const sortedKeys = Object.keys(summary).filter(product => summary[product] > 0).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
                const data = sortedKeys.map(product => {
                    const invItem = inventory && Array.isArray(inventory) ? inventory.find(i => String(i.name).trim() === String(product).trim()) : null;
                    const price = invItem ? Number(invItem.price) : (productHistory && productHistory[product] ? Number(productHistory[product]) : 0);
                    return { '상품명': product, '제품금액': price, '입금완료 수량': paidSummary[product]||0, '미입금 수량': (summary[product]||0) - (paidSummary[product]||0) };
                }); 
                downloadExcel(data, '상품별_발주리스트'); 
            };

            const handleExportCustomers = () => { 
                const groups = {}; orders.forEach(o => { if (!groups[o.customer]) groups[o.customer] = []; groups[o.customer].push(o); }); 
                let entries = Object.entries(groups).map(([nick, items]) => {
                    const activeItems = items.filter(i => !i.isCancelled); const isCard = cardPayments[nick]; 
                    const hasCashReceipt = cashReceipts[nick];
                    const productTotal = activeItems.reduce((sum, i) => sum + Number(i.price), 0);
                    const currentShipping = getCalculatedShipping(nick, productTotal);
                    const depositTotal = items.reduce((sum, i) => sum + (i.deposit || 0), 0); 
                    const grandTotal = productTotal + (activeItems.length > 0 ? currentShipping : 0); 
                    const isPaid = (depositTotal >= grandTotal) || isCard;
                    const balance = grandTotal - depositTotal;
                    return { nick, items: activeItems, isPaid, isCard, hasCashReceipt, depositTotal, grandTotal, balance };
                });

                const getStatusPriority = (entry) => { if (entry.isPaid && !entry.isCard) return 1; if (entry.isCard) return 2; return 3; };
                entries.sort((a, b) => { 
                    const pA = getStatusPriority(a); 
                    const pB = getStatusPriority(b); 
                    if (pA !== pB) return pA - pB; 
                    return a.nick.localeCompare(b.nick); 
                });

                let excelRows = []; entries.forEach(({ nick, items, isPaid, isCard, hasCashReceipt, depositTotal, grandTotal, balance }) => { 
                    if(items.length === 0) return; 
                    const addrInfo = findAddress(nick) || {}; 
                  const fullAddress = addrInfo.zipcode ? `(${addrInfo.zipcode}) ${addrInfo.address || ''}` : (addrInfo.address || ''); 
                    
                    let cleanPhone = fixPhoneNumber(addrInfo.phone);

                    // 상태 확인
                    const isVip = specialCustomers && specialCustomers[normalizeString(nick)]?.type === 'vip';
                    const isNoShow = noShowCustomers && noShowCustomers[nick];
                    const isWaitlist = waitlistCustomers && waitlistCustomers[nick];

                    // 💡 [수정됨] 입금상태 열 1개에 모든 상태를 텍스트로 합쳐서 출력
                    let statusColumn = "";
                    if (isNoShow) {
                        statusColumn = "노쇼";
                    } else if (isWaitlist) {
                        statusColumn = "거파대기";
                    } else if (hasCashReceipt) {
                        statusColumn = "현금영수증";
                    } else if (isCard) {
                        statusColumn = "카드결제";
                    } else if (isPaid) {
                        statusColumn = "완납";
                    } else {
                        statusColumn = depositTotal > 0 ? `부분입금(미수 ${balance.toLocaleString()})` : `미입금(미수 ${balance.toLocaleString()})`;
                    }
                    
                    const createRow = (productValue) => ({ 
                        '날짜시간': new Date().toLocaleString(), 
                        '입금상태': statusColumn, 
                        '닉네임': isVip ? `[VIP] ${nick}` : nick, // 열을 추가하는 대신 닉네임 옆에 VIP 표기
                        '주문제품(수량)': productValue, 
                        '이름': addrInfo.realname || '', 
                        '핸드폰번호': cleanPhone, 
                        '주소': fullAddress, 
                        '배송메모': addrInfo.memo || ''
                    }); 
                    
                    excelRows.push(createRow(`[ ${nick} ]`)); items.forEach(item => { const qtyPart = item.quantity > 1 ? ` ★${item.quantity}개` : ''; excelRows.push(createRow(`${item.product}${qtyPart}`)); }); 
                }); 
                downloadExcel(excelRows, '고객별_정산_배송리스트'); 
            };

            const handleExportAllMessages = () => {
         
                const groups = {}; orders.forEach(o => { if (!groups[o.customer]) groups[o.customer] = []; groups[o.customer].push(o); });
                const templateConfigStr = localStorage.getItem(getLsKey('templateConfig'));
                const templateConfigLocal = templateConfigStr ? JSON.parse(templateConfigStr) : { emoji: '💙', paidMsg: '😍 완납 확인! 감사합니다 😍', unpaidPrefix: '[미입금]\n총 입금하실 금액\n👉', overpaidMsg: '과납 금액이 있습니다.\n환불 또는 적립 여부를 알려주세요!', addrNotice: '※ 배송지 변경 시 채팅으로 변경할 주소를 남겨주세요!', surveyNotice: '방송마다 1회 하단의 주문서(배송지입력) 필수!!', alwaysRequestAddress: false };
                const overpaidMsg = templateConfigLocal.overpaidMsg || '과납 금액이 있습니다.\n환불 또는 적립 여부를 알려주세요!';
                const bankStr = localStorage.getItem(getLsKey('bankAccount')) || "카카오뱅크 김선정\n7942 18 01611";
                const sentAddressRequestsStr = localStorage.getItem(getLsKey('sentAddressRequests')); const sentAddressRequestsLocal = sentAddressRequestsStr ? new Set(JSON.parse(sentAddressRequestsStr)) : new Set();
                const data = []; 
                Object.entries(groups).forEach(([nick, items]) => {
                    const activeItems = items.filter(i => !i.isCancelled); if (activeItems.length === 0) return;
                    const isCard = cardPayments && cardPayments[nick]; const productTotal = activeItems.reduce((sum, i) => sum + Number(i.price), 0);
                    const currentShipping = getCalculatedShipping(nick, productTotal); const baseGrandTotal = productTotal + currentShipping;
                    const depositTotal = items.reduce((sum, i) => sum + (i.deposit || 0), 0); const baseBalance = baseGrandTotal - depositTotal;
                    const cardFee = (isCard && baseBalance > 0) ? baseBalance * 0.1 : 0; const grandTotal = baseGrandTotal + cardFee; const balance = baseBalance + cardFee;
                    const itemListTextForMsg = activeItems.map(i => `${i.product}${i.quantity > 1 ? ` ★${i.quantity}개` : ''} ${Number(i.price).toLocaleString()}원`).join('\n');
                    const itemListTextForExcel = activeItems.map(i => `${i.product}(${i.quantity}개)`).join(', '); 
                    const addrInfo = findAddress(nick) || {};
                    let msg = `${templateConfigLocal.emoji} ${nick} 님 ${templateConfigLocal.emoji}\n\n[${broadcastName} 주문목록]\n${itemListTextForMsg}\n배송비 ${currentShipping.toLocaleString()}원\n\n총 주문금액 ${baseGrandTotal.toLocaleString()}원\n------------------\n`;
                    let statusStr = '';
                    if (isCard) { 
                        statusStr = '카드결제'; const cardBase = Math.max(0, baseGrandTotal - depositTotal);
                        if (depositTotal > 0) { msg += `[카드결제]\n총 주문금액 ${baseGrandTotal.toLocaleString()}원\n선입금 ${depositTotal.toLocaleString()}원\n수수료(10%) ${(cardBase * 0.1).toLocaleString()}원\n👉결제요청액 ${(cardBase * 1.1).toLocaleString()}원 예정\n\n핸드폰번호 남겨주세요🌸\n------------------\n\n`; } 
                        else { msg += `[카드결제]\n금액 ${cardBase.toLocaleString()}원\n수수료(10%) ${(cardBase * 0.1).toLocaleString()}원\n👉결제요청액 ${(cardBase * 1.1).toLocaleString()}원 예정\n\n핸드폰번호 남겨주세요🌸\n------------------\n\n`; }
                    } else { 
                        const isPaid = (balance <= 0) && (grandTotal >= 0); 
                        if (depositTotal > 0 && balance <= 0) { msg += `[입금확인]\n${depositTotal.toLocaleString()}원\n------------------\n\n`; } 
                        else if (depositTotal > 0 && balance > 0) { msg += `[입금확인]\n${depositTotal.toLocaleString()}원 (일부 입금)\n------------------\n\n`; }
                        if (balance > 0) {
                            statusStr = depositTotal > 0 ? `부분입금(미수 ${balance.toLocaleString()})` : `미입금(미수 ${balance.toLocaleString()})`;
                            if (depositTotal > 0) { msg += `[부분 미수 안내]\n남은 미수금 👉 ${balance.toLocaleString()}원\n\n${bankStr}\n추가 입금 부탁드립니다 🙏\n------------------\n\n`; } 
                            else { msg += `${templateConfigLocal.unpaidPrefix}\n${balance.toLocaleString()}원 \n\n${bankStr}\n입금 부탁드립니다 🙏\n------------------\n\n`; }
                        } else if (balance < 0) { statusStr = '과납'; msg += `${templateConfigLocal.paidMsg}\n\n[과납 안내]\n과납액: ${Math.abs(balance).toLocaleString()}원\n${overpaidMsg}\n------------------\n`; } 
                        else { statusStr = '입금'; if (isPaid) msg += `${templateConfigLocal.paidMsg}\n------------------\n`; }
                    }
                   if (addrInfo && addrInfo.address && !templateConfigLocal.alwaysRequestAddress) {
                        let cleanPhone = fixPhoneNumber(addrInfo.phone);
                        msg += `\n[배송지 확인]\n\n${addrInfo.realname || nick}\n${cleanPhone}\n${addrInfo.address} ${addrInfo.zipcode ? `(${addrInfo.zipcode})` : ''}\n${addrInfo.memo ? addrInfo.memo + '\n' : ''}\n------------------\n${templateConfigLocal.addrNotice}`; 
                    } else if (!sentAddressRequestsLocal.has(nick) || templateConfigLocal.alwaysRequestAddress) { msg += `\n${templateConfigLocal.surveyNotice}`; }
                    data.push({ '닉네임': nick, '상품명': itemListTextForExcel, '가격': grandTotal.toLocaleString() + '원', '입금액': depositTotal.toLocaleString() + '원', '상태': statusStr, '카톡전송메세지': msg });
                });
                if (data.length === 0) { openModal("주문 내역이 없습니다.", "alert"); return; }
                data.sort((a, b) => String(a['닉네임'] || '').localeCompare(String(b['닉네임'] || '')));
                downloadExcel(data, '전체고객_카톡메세지_리스트');
            };

            const handlePrintPackingList = () => {

                        </div>
                    )}
                    
                    <div className="bg-white dark:bg-slate-800 border-b dark:border-slate-700 shadow-sm px-4 py-2 flex justify-between items-center z-10 shrink-0">
                        <div className="flex items-center gap-3">
                            <h1 className="text-xl font-black tracking-tight text-slate-800 dark:text-white flex items-center gap-2"><Icon name="shopping-bag" weight="fill" className="text-blue-500" /> 주문서 관리 시스템</h1>
                            <div className="flex bg-slate-100 dark:bg-slate-900 rounded-lg p-1 ml-4 shadow-inner border dark:border-slate-700 items-center">
                                <button onClick={() => setActiveTab('live')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${activeTab === 'live' ? 'bg-white dark:bg-slate-700 shadow-sm text-blue-600 dark:text-blue-400 border border-slate-200 dark:border-slate-600' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'}`}><Icon name="broadcast" weight={activeTab === 'live' ? 'fill' : 'regular'} className="inline-block mr-1"/> 라이브</button>
                                <button onClick={() => setActiveTab('management')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${activeTab === 'management' ? 'bg-white dark:bg-slate-700 shadow-sm text-blue-600 dark:text-blue-400 border border-slate-200 dark:border-slate-600' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200'}`}><Icon name="kanban" weight={activeTab === 'management' ? 'fill' : 'regular'} className="inline-block mr-1"/> 정산 / 내보내기</button>
                                <div className="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1.5"></div>
                                <button onClick={() => window.dispatchEvent(new CustomEvent('force-sync'))} className="px-3 py-1.5 rounded-md text-sm font-bold text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition-colors flex items-center gap-1" title="데이터 즉시 동기화 (단축키: Alt + R)">
                                    <Icon name="arrows-clockwise" weight="bold" /> 새로고침
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2 rounded-full transition-colors flex items-center justify-center border shadow-sm ${soundEnabled ? 'bg-blue-50 border-blue-200 text-blue-600 dark:bg-blue-900/30 dark:border-blue-700/50 dark:text-blue-400' : 'bg-slate-100 border-slate-200 text-slate-400 dark:bg-slate-800 dark:border-slate-700'}`} title={soundEnabled ? "알림음 켜짐" : "알림음 꺼짐"}><Icon name={soundEnabled ? "speaker-high" : "speaker-slash"} weight="fill" size={18} /></button>
                            <button onClick={() => setIsStatusModalOpen(true)} className="p-2 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 hover:bg-blue-100 dark:hover:bg-blue-900/40 rounded-full transition-colors flex items-center justify-center shadow-sm" title="통합 고객상태 관리 (VIP, 노쇼, 관리자)"><Icon name="users-three" weight="fill" size={18} /></button>
                            <button onClick={() => setIsSettingsOpen(!isSettingsOpen)} className="p-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors flex items-center justify-center shadow-sm" title="환경설정"><Icon name="gear" weight="fill" size={18} /></button>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors flex items-center justify-center shadow-sm" title={isDarkMode ? "라이트 모드로 전환" : "다크 모드로 전환"}><Icon name={isDarkMode ? "sun" : "moon"} weight="fill" size={18} /></button>
                        </div>
                    </div>

                    {isSettingsOpen && <SettingsModalContent googleScriptUrl={googleScriptUrl} setGoogleScriptUrl={setGoogleScriptUrl} chatSheetId={chatSheetId} setChatSheetId={setChatSheetId} depSheetId={depSheetId} setDepSheetId={setDepSheetId} addrSheetId={addrSheetId} setAddrSheetId={setAddrSheetId} masterSheetId={masterSheetId} setMasterSheetId={setMasterSheetId} broadcastName={broadcastName} setBroadcastName={setBroadcastName} quickShipping={quickShipping} setQuickShipping={setQuickShipping} jejuShipping={jejuShipping} setJejuShipping={setJejuShipping} freeShippingThreshold={freeShippingThreshold} setFreeShippingThreshold={setFreeShippingThreshold} templateConfig={templateConfig} setTemplateConfig={setTemplateConfig} bankAccount={bankAccount} setBankAccount={setBankAccount} quickMessages={quickMessages} setQuickMessages={setQuickMessages} addressStartDate={addressStartDate} setAddressStartDate={setAddressStartDate} soundVolume={soundVolume} setSoundVolume={setSoundVolume} setIsSettingsOpen={setIsSettingsOpen} />}

                    <div className="flex-1 overflow-hidden flex flex-col">
                        <div className={`flex-1 overflow-hidden ${activeTab === 'live' ? 'flex' : 'hidden'}`}>
                            <LiveTab orders={orders} setOrders={setOrders} productHistory={productHistory} setProductHistory={setProductHistory} quickShipping={quickShipping} jejuShipping={jejuShipping} freeShippingThreshold={freeShippingThreshold} shippingOverrides={shippingOverrides} setShippingOverrides={setShippingOverrides} bankAccount={bankAccount} googleScriptUrl={googleScriptUrl} chatSheetId={chatSheetId} depSheetId={depSheetId} addrSheetId={addrSheetId} masterSheetId={masterSheetId} addresses={addresses} setAddresses={setAddresses} cardPayments={cardPayments} setCardPayments={setCardPayments} manualDeposits={manualDeposits} setManualDeposits={setManualDeposits} matchedDeposits={matchedDeposits} setMatchedDeposits={setMatchedDeposits} depositLinks={depositLinks} setDepositLinks={setDepositLinks} depositorNames={depositorNames} setDepositorNames={setDepositorNames} clickedChats={clickedChats} setClickedChats={setClickedChats} openModal={openModal} keywords={keywords} setKeywords={setKeywords} sentAddressRequests={sentAddressRequests} setSentAddressRequests={setSentAddressRequests} deletedDepositIds={deletedDepositIds} setDeletedDepositIds={setDeletedDepositIds} checkedOrders={checkedOrders} setCheckedOrders={setCheckedOrders} addressMapping={addressMapping} setAddressMapping={setAddressMapping} templateConfig={templateConfig} specialCustomers={specialCustomers} setSpecialCustomers={setSpecialCustomers} inventory={inventory} setInventory={setInventory} quickMessages={quickMessages} handleResetAllData={handleResetAllData} broadcastName={broadcastName} setGlobalError={setGlobalError} cashReceipts={cashReceipts} setCashReceipts={setCashReceipts} soundEnabled={soundEnabled} soundVolume={soundVolume} noShowCustomers={noShowCustomers} setNoShowCustomers={setNoShowCustomers} waitlistCustomers={waitlistCustomers} setWaitlistCustomers={setWaitlistCustomers} />
                        </div>
                        <div className={`flex-1 overflow-y-auto ${activeTab === 'management' ? 'block' : 'hidden'}`}>
                            <OrderManagementTab orders={orders} shippingOverrides={shippingOverrides} quickShipping={quickShipping} jejuShipping={jejuShipping} freeShippingThreshold={freeShippingThreshold} broadcastName={broadcastName} addresses={addresses} handleExportBackup={handleExportBackup} handleImportBackup={handleImportBackup} addressMapping={addressMapping} cardPayments={cardPayments} specialCustomers={specialCustomers} openModal={openModal} cashReceipts={cashReceipts} inventory={inventory} productHistory={productHistory} noShowCustomers={noShowCustomers} waitlistCustomers={waitlistCustomers} />
                        </div>
                    </div>

                    <Modal isOpen={modalConfig.isOpen} type={modalConfig.type} message={modalConfig.message} onConfirm={modalConfig.onConfirm} onCancel={modalConfig.onCancel} initialValue={modalConfig.initialValue} />
                    <CustomerStatusModal isOpen={isStatusModalOpen} onClose={() => setIsStatusModalOpen(false)} specialCustomers={specialCustomers} setSpecialCustomers={setSpecialCustomers} googleScriptUrl={googleScriptUrl} masterSheetId={masterSheetId} openModal={openModal} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
